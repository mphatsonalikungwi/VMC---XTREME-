name: VMC Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-capacitor-foundation

permissions:
  contents: read

concurrency:
  group: vmc-android-debug
  cancel-in-progress: true

jobs:
  build-android:
    name: Build VMC Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK tools
        working-directory: mobile
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the GitHub runner."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install required Android SDK packages
        working-directory: mobile
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Capacitor configuration
        run: npx cap doctor

      - name: Generate Android project
        run: npx cap add android

      - name: Apply Android back-button navigation
        run: node scripts/patch-android-navigation.mjs

      - name: Fetch official VMC logo
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/res/drawable
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/mphatsonalikungwi/VMC---XTREME-/main/assets/logo.png" \
            --output android/app/src/main/res/drawable/vmc_logo.png
          test -s android/app/src/main/res/drawable/vmc_logo.png

      - name: Apply VMC Android branding
        run: node scripts/brand-android.mjs

      - name: Synchronize web assets and native dependencies
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vmc-xtreme-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
