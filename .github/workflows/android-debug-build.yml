name: VMC Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-capacitor-foundation

permissions:
  contents: read

concurrency:
  group: vmc-android-debug
  cancel-in-progress: true

jobs:
  build-android:
    name: Build VMC Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Capacitor configuration
        run: npx cap doctor

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize web assets and native dependencies
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vmc-xtreme-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
