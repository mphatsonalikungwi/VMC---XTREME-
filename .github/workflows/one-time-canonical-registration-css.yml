name: One-time canonical registration CSS repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the canonical wizard CSS
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          marker = "style.id='vmcRegistrationStyles';style.textContent=`"
          start = s.find(marker)
          if start < 0:
              raise SystemExit('CANONICAL_REGISTRATION_STYLE_NOT_FOUND')
          css_start = start + len(marker)
          css_end = s.find('`;document.head.appendChild(style);', css_start)
          if css_end < 0:
              raise SystemExit('CANONICAL_REGISTRATION_STYLE_END_NOT_FOUND')
          css = r'''.vmc-reg-progress{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}.vmc-reg-progress span{padding:10px 12px;border:1px solid #2a2d34;border-radius:12px;color:#737780;background:#0b0c0f;font-size:.68rem;font-weight:900}.vmc-reg-progress span.active{border-color:#7b1e28;background:#1b1114;color:#ff6673}.vmc-reg-progress b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-right:6px;background:#272a30;color:#fff}.vmc-reg-progress span.active b{background:#e31b2d}.vmc-reg-step[hidden]{display:none!important}#registerView .vmc-reg-step:not([hidden]){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:13px 16px!important;align-items:start!important;width:100%!important}.#registerView .vmc-reg-step>*{min-width:0!important}.vmc-reg-step>.field{grid-column:auto!important;min-width:0;width:100%}#registerView .vmc-reg-step>.field{grid-column:auto!important;min-width:0!important;width:100%!important;margin:0!important}.vmc-reg-step>.vmc-reg-welcome,.vmc-reg-step>.selected-plan,.vmc-reg-step>.vmc-reg-section,.vmc-reg-step>.vmc-reg-rules,.vmc-reg-step>.vmc-reg-actions,.vmc-reg-step>.vmc-reg-skip,.vmc-reg-step>.vmc-reg-optional-intro{grid-column:1/-1!important}#registerView .vmc-reg-step>.vmc-reg-welcome,#registerView .vmc-reg-step>.selected-plan,#registerView .vmc-reg-step>.vmc-reg-section,#registerView .vmc-reg-step>.vmc-reg-rules,#registerView .vmc-reg-step>.vmc-reg-actions,#registerView .vmc-reg-step>.vmc-reg-skip,#registerView .vmc-reg-step>.vmc-reg-optional-intro{grid-column:1/-1!important}.vmc-reg-section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}.vmc-reg-section>h4,.vmc-reg-section>.vmc-reg-section-copy{grid-column:1/-1}.vmc-reg-section>.field{grid-column:auto!important;min-width:0;width:100%}#registerView .vmc-reg-section>.field{grid-column:auto!important;min-width:0!important;width:100%!important;margin:0!important}#registerView .vmc-reg-step .field input,#registerView .vmc-reg-step .field select{width:100%!important;box-sizing:border-box!important;min-width:0!important}.vmc-reg-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.vmc-reg-actions .btn{width:100%;min-width:0}.vmc-reg-welcome{padding:17px 16px 15px;border:1px solid #4b1b23;background:linear-gradient(135deg,#211115,#171318);border-radius:15px}.vmc-reg-welcome-kicker{color:#ff5b68;font-size:.63rem;font-weight:950;letter-spacing:.14em}.vmc-reg-welcome h3,.vmc-reg-optional-intro h3{margin:6px 0 6px;font-size:1.25rem;line-height:1.15;text-transform:none}.vmc-reg-welcome p,.vmc-reg-optional-intro p{margin:0;color:#c5c8ce;font-size:.8rem;line-height:1.55}.vmc-reg-section{border-top:1px solid #2a2d34;padding-top:15px;margin-top:2px}.vmc-reg-section h4{margin:0 0 5px;color:#ff4050;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}.vmc-reg-section h4 span{color:#858991;font-size:.65rem;letter-spacing:0;text-transform:none}.vmc-reg-section-copy{margin:0 0 11px;color:#9498a0;font-size:.74rem;line-height:1.45}.vmc-reg-membership{border-top:0;padding-top:2px}.vmc-reg-price{background:#17191e;border:1px solid #30343b;border-left:4px solid #e31b2d;padding:12px 13px;margin-top:2px;border-radius:11px}.vmc-reg-price span{display:block;color:#92969e;font-size:.68rem}.vmc-reg-price strong{display:block;font-size:1.35rem;margin-top:2px}.vmc-reg-hint{display:block;color:#92969e;font-size:.68rem;margin-top:5px}.vmc-reg-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}.vmc-reg-actions .btn{flex:1;min-width:150px}.vmc-reg-skip{display:block;border:0;background:none;color:#92969e;text-decoration:underline;font-size:.74rem;text-align:center;margin-top:0}.vmc-reg-optional-intro{padding:16px;border:1px solid #2e3239;background:#15171b;border-radius:14px}.vmc-reg-rules{display:flex;align-items:flex-start;gap:9px;color:#c7cad0;font-size:.78rem}.vmc-reg-rules input{margin-top:4px;accent-color:#e31b2d}@media(max-width:760px){.vmc-reg-progress{font-size:.62rem}.vmc-reg-progress span{padding:9px 8px}#registerView .vmc-reg-step:not([hidden]){grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:12px 10px!important}.#registerView .vmc-reg-section{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:10px!important}.#registerView .vmc-reg-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;display:grid!important}.#registerView .vmc-reg-actions .btn{width:100%!important;min-width:0!important}.vmc-reg-welcome h3,.vmc-reg-optional-intro h3{font-size:1.12rem}.vmc-reg-step .field label{font-size:.7rem}.vmc-reg-step .field input,.vmc-reg-step .field select{padding:11px 10px;font-size:.9rem}}'''
          if '.#registerView' in css:
              css = css.replace('.#registerView', '#registerView')
          s = s[:css_start] + css + s[css_end:]
          p.write_text(s, encoding='utf-8')

          i = Path('index.html')
          h = i.read_text(encoding='utf-8')
          h2 = re.sub(r'<script\s+src=["\']app\.js(?:\?[^"\']*)?["\']', '<script src="app.js?v=20260902-canonical-grid"', h, count=1)
          if h2 == h:
              raise SystemExit('APP_JS_SCRIPT_TAG_NOT_FOUND')
          i.write_text(h2, encoding='utf-8')
      - name: Verify source integrity
        shell: bash
        run: |
          node --check app.js
          grep -q "#registerView .vmc-reg-step:not(\[hidden\])" app.js
          grep -q "grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important" app.js
          grep -q "app.js?v=20260902-canonical-grid" index.html
          ! grep -q "publicRegister" cloudflare-ui-patch.js
          ! grep -q "VMC_FINAL_REGISTRATION_LAYOUT" app.js
          ! grep -q "VMC_DIRECT_REGISTRATION_LAYOUT" index.html
      - name: Commit source repair and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-canonical-registration-css.yml
          git add app.js index.html
          git commit -m "fix: make canonical registration form two-column across devices"
          git push
