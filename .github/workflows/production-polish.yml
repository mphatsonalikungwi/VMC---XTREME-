name: Production frontend polish
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("const API_BASE=(window.VMC_API_BASE||'').replace(/\\/+$/,'');", "const API_BASE='https://vmc-xtreme-1.onrender.com';")
          s = s.replace(' Designed by Mpha30.', '')
          marker = '<section id="services"><div class="wrap">'
          if 'id="approach"' not in s and marker in s:
              section = '''<section id="approach" class="approach-section"><div class="wrap"><div class="section-head"><div class="kicker">The VMC approach</div><h2>A better way to use your gym time.</h2><p>No complicated promises. Come in, know what you are working on, and leave knowing you did something useful.</p></div><div class="approach-grid"><article class="approach-card"><span class="approach-number">01</span><h3>Choose your focus</h3><p>Strength, conditioning, weight loss, muscle building or simply getting started — pick the reason you came in.</p></article><article class="approach-card approach-card-featured"><span class="approach-number">02</span><h3>Train with purpose</h3><p>Use the equipment, sessions and guidance available at VMC to turn your time in the gym into consistent work.</p></article><article class="approach-card"><span class="approach-number">03</span><h3>Keep showing up</h3><p>Progress is built from repeat visits, good habits and a training environment that makes consistency easier.</p></article></div></div></section>'''
              s = s.replace(marker, section + '\n' + marker, 1)
          style_marker = '</style>\n</head>'
          style = '''<style id="vmc-human-polish">
.approach-section{padding-top:78px;padding-bottom:72px;background:linear-gradient(180deg,#0a0d10,#0d1115)}
.approach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.approach-card{position:relative;padding:28px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:#11161b;min-height:220px;overflow:hidden}
.approach-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(242,193,78,.35)}
.approach-card-featured{background:linear-gradient(145deg,rgba(233,75,85,.12),#11161b 65%);border-color:rgba(233,75,85,.28)}
.approach-card-featured:before{background:linear-gradient(180deg,#e94b55,#ff8658)}
.approach-number{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:10px;background:rgba(242,193,78,.08);color:#f2c14e;font-weight:900;font-size:11px;margin-bottom:26px}
.approach-card h3{font-size:24px;margin-bottom:8px}.approach-card p{color:#aeb5bd;max-width:330px}
.pricing-hero{box-shadow:0 24px 70px rgba(0,0,0,.28)}
.pricing-hero .pricing{background:#090c0f;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:10px}
.pricing-hero .price-card{border-radius:14px;background:linear-gradient(180deg,#171c22,#11151a);border-color:rgba(255,255,255,.08);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.pricing-hero .price-card:hover{transform:translateY(-3px);border-color:rgba(242,193,78,.32);box-shadow:0 14px 30px rgba(0,0,0,.22)}
.pricing-hero .price-card.featured{border-color:rgba(233,75,85,.52);background:linear-gradient(145deg,rgba(233,75,85,.14),#151a20 58%);box-shadow:0 14px 34px rgba(233,75,85,.10)}
.pricing-hero .price-card h4{letter-spacing:.01em}.pricing-hero .price{font-variant-numeric:tabular-nums}.pricing-hero .price-card li strong{color:#fff}.pricing-hero .price-card li:last-child{border-bottom:0;color:#f2c14e;font-weight:800}
@media(max-width:760px){.approach-grid{grid-template-columns:1fr}.approach-card{min-height:auto}.approach-section{padding-top:58px;padding-bottom:55px}}
</style>
'''
          if 'id="vmc-human-polish"' not in s and style_marker in s:
              s = s.replace(style_marker, style + style_marker, 1)
          p.write_text(s)
          PY
      - name: Commit polished frontend
        run: |
          git config user.name 'VMC Xtreme Production'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No frontend changes required.'
          else
            git commit -m 'feat: refresh layout and connect dashboard API'
            git push
          fi
