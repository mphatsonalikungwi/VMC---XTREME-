name: Registration source cleanup
on:
  push:
    paths:
      - '.github/workflows/registration-source-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate public registration interceptor
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare-ui-patch.js')
          s = p.read_text()
          start = s.index('async function publicRegister(form){')
          end = s.index('function upgradePublic(){', start)
          s = s[:start] + s[end:]
          start = s.index('function upgradePublic(){')
          end = s.index('function durationFix(root=document){', start)
          replacement = '''function upgradePublic(){
const login=$('#loginForm');
if(!login)return;
style();
const le=$('#loginEmail');
if(le){
  le.type='text';
  le.name='identifier';
  le.required=true;
  le.placeholder='Username or phone number';
  const lab=login.querySelector('label[for="loginEmail"]');
  if(lab)lab.textContent='VMC Username or Phone Number';
  let h=login.querySelector('.vmc-login-hint');
  if(!h){
    h=document.createElement('p');
    h.className='vmc-login-hint';
    h.textContent='Use your VMC Username or registered phone number.';
    login.querySelector('.form-grid')?.prepend(h)
  }
}
if(login.dataset.vmcIntercept)return;
login.dataset.vmcIntercept='1';
login.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation();publicLogin(login)},true)
}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
      - name: Verify registration interceptor is gone
        run: |
          ! grep -q 'publicRegister' cloudflare-ui-patch.js
          ! grep -q "e.target===reg" cloudflare-ui-patch.js
          grep -q 'function upgradePublic' cloudflare-ui-patch.js
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-ui-patch.js
          git rm .github/workflows/registration-source-cleanup.yml
          git commit -m 'refactor: make app.js canonical registration owner'
          git push
