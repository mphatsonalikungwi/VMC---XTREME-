name: Registration source cleanup
on:
  push:
    paths:
      - '.github/workflows/registration-source-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgically remove competing public registration implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('cloudflare-ui-patch.js')
          s = p.read_text()

          # publicRegister is a single-line function in this source; remove only through the next function boundary.
          pattern = r'async function publicRegister\(form\)\{.*?\nfunction upgradePublic'
          s2, n = re.subn(pattern, 'function upgradePublic', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('publicRegister boundary not found')

          # Registration must remain owned exclusively by app.js. Keep only the public login enhancement here.
          start = s2.find('function upgradePublic(')
          end_marker = 'function durationFix(root=document){'
          end = s2.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('upgradePublic boundaries not found')
          replacement = '''function upgradePublic(){const login=$('#loginForm');if(!login)return;style();const le=$('#loginEmail');if(le){le.type='text';le.name='identifier';le.required=true;le.placeholder='Username or phone number';const lab=login.querySelector('label[for="loginEmail"]');if(lab)lab.textContent='VMC Username or Phone Number';let h=login.querySelector('.vmc-login-hint');if(!h){h=document.createElement('p');h.className='vmc-login-hint';h.textContent='Use your VMC Username or registered phone number.';login.querySelector('.form-grid')?.prepend(h)}}if(login.dataset.vmcIntercept)return;login.dataset.vmcIntercept='1';login.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation();publicLogin(login)},true)}
'''
          s2 = s2[:start] + replacement + s2[end:]

          # Remove stale registration-only CSS from the source page.
          ip = Path('index.html')
          html = ip.read_text()
          html2 = re.sub(r'<style id="VMC_REGISTRATION_LAYOUT_FIX_V2">.*?</style>\s*', '', html, flags=re.S)

          # Remove only the known duplicate flex declaration; canonical registration CSS lives in app.js wizard setup.
          ap = Path('app.js')
          a = ap.read_text()
          a2 = a.replace('.vmc-reg-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}', '.vmc-reg-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:5px}')

          if 'publicRegister' in s2: raise SystemExit('publicRegister remains')
          if "$('#registerForm')" in s2: raise SystemExit('registerForm ownership remains in cloudflare-ui-patch')
          if 'e.target===reg' in s2: raise SystemExit('registration submit interception remains')
          if '<style id="VMC_REGISTRATION_LAYOUT_FIX_V2">' in html2: raise SystemExit('stale registration layout style remains')
          if '.vmc-reg-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}' in a2: raise SystemExit('duplicate flex action rule remains')

          p.write_text(s2)
          ip.write_text(html2)
          ap.write_text(a2)
          print('SOURCE VERIFICATION PASSED')
          PY
      - name: Commit cleanup and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-ui-patch.js index.html app.js
          git rm .github/workflows/registration-source-cleanup.yml
          git diff --cached --check
          git commit -m 'fix: remove competing registration implementation'
          git push
