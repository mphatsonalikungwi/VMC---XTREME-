name: Repair registration JavaScript v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove malformed layout patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text()
          pattern=r"function vmcCompactRegistrationLayout\(\)\{.*?\nfunction setupRegistrationWizard\(\)\{"
          replacement="function vmcCompactRegistrationLayout(){}\nfunction vmcRegistrationSameLayout(){}\nfunction setupRegistrationWizard(){"
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('Expected malformed registration layout block not found; refusing unrelated edit.')
          p.write_text(s2)
          PY
      - name: Verify JavaScript
        run: node --check app.js
      - name: Commit repair and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git rm .github/workflows/repair-registration-js.yml .github/workflows/repair-registration-js-v2.yml
          git commit -m 'fix: restore registration interactions and JavaScript execution'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
