name: VMC final patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('dashboard.html')
          s=p.read_text()
          s=s.replace('data-act=\"approve\" data-mid=', 'data-act=\"approve\" data-id=')
          s=s.replace('data-act=\"reject\" data-mid=', 'data-act=\"reject\" data-id=')
          s=s.replace('data-act=\"verify\" data-mid=', 'data-act=\"verify\" data-id=')
          s=s.replace('data-act=\"reject-payment\" data-mid=', 'data-act=\"reject-payment\" data-id=')
          s=s.replace('data-act=\"renew\" data-mid=', 'data-act=\"renew\" data-id=')
          p.write_text(s)

          p=Path('app.js')
          s=p.read_text()
          marker='  async function loginMember(event) {'
          reactivation='''  function renderReactivation(profile, email) {\n    if ($('#loginView')) $('#loginView').hidden = true;\n    if ($('#registerView')) $('#registerView').hidden = true;\n    if ($('#successView')) $('#successView').hidden = false;\n    if ($('#modalTitle')) $('#modalTitle').textContent = 'Membership Reactivation';\n    const view = $('#successView');\n    if (!view) return;\n    view.innerHTML = `\n      <div class=\"success\">\n        <div class=\"success-icon\">!</div>\n        <h2>Membership expired.</h2>\n        <p>Your membership has expired because it was not renewed. To initiate reactivation, confirm that you agree to make your membership payment.</p>\n        <div class=\"status-box\"><span class=\"status-label\">Account status</span><span class=\"status-value\">REACTIVATION REQUIRED</span></div>\n        <div class=\"account-box\"><div class=\"account-grid\">\n          <div><small>Member</small><strong>${esc(profile?.full_name || 'VMC Member')}</strong></div>\n          <div><small>Email</small><strong>${esc(email || '')}</strong></div>\n          <div><small>Membership</small><strong>${esc(profile?.membership_tier || '—')}</strong></div>\n          <div><small>Payment</small><strong>Pending Payment Verification</strong></div>\n        </div></div>\n        <label class=\"check\" style=\"margin-top:16px\"><input id=\"reactivationAgree\" type=\"checkbox\"><span>I agree to make the required membership payment and understand that VMC management must verify the payment.</span></label>\n        <div class=\"form-error\" id=\"reactivationError\" role=\"alert\"></div>\n        <div class=\"form-actions\"><button class=\"btn btn-red\" id=\"reactivateBtn\" type=\"button\">Initiate Reactivation</button><button class=\"btn btn-dark\" id=\"reactivateClose\" type=\"button\">Close</button></div>\n      </div>`;\n    $('#reactivateClose')?.addEventListener('click', closeModal);\n    $('#reactivateBtn')?.addEventListener('click', async () => {\n      const errorBox=$('#reactivationError'), button=$('#reactivateBtn');\n      if (!$('#reactivationAgree')?.checked) { setError(errorBox, 'Please confirm that you agree to make the membership payment.'); return; }\n      button.disabled=true; button.textContent='Initiating…';\n      try {\n        const {data,error}=await supabase.functions.invoke('vmc-member-api',{body:{action:'reactivate'}});\n        if (error) throw error;\n        if (data?.error) throw new Error(data.error);\n        const latest=await currentProfile();\n        renderAccount(latest.profile,email);\n        showToast('Reactivation initiated. Your account is active and flagged for payment verification.');\n      } catch (err) { setError(errorBox, friendlyError(err)); button.disabled=false; button.textContent='Initiate Reactivation'; }\n    });\n  }\n\n'''
          if marker in s and 'function renderReactivation(profile, email)' not in s:
              s=s.replace(marker, reactivation+marker, 1)
          old="      if (profile.account_status !== 'active') throw new Error('This account is not active. Contact VMC management.');"
          new="""      if (!management) {\n        const { data: lifecycle, error: lifecycleError } = await supabase.functions.invoke('vmc-member-api', { body: { action: 'status' } });\n        if (lifecycleError) throw lifecycleError;\n        if (lifecycle?.status === 'reactivation_required') { renderReactivation(lifecycle.profile || profile, user.email); return; }\n      }\n      if (profile.account_status !== 'active') throw new Error('This account is not active. Contact VMC management.');"""
          if old not in s:
              raise SystemExit('login guard not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "VMC Xtreme Automation"
          git config user.email "actions@github.com"
          git add dashboard.html app.js
          git diff --cached --quiet || git commit -m "fix approvals payments renewals and member reactivation"
          git push
          rm -f .github/workflows/vmc-final-patch.yml
          git add .github/workflows/vmc-final-patch.yml
          git commit -m "remove one-time patch workflow"
          git push
