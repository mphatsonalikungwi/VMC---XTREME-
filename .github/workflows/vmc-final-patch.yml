name: VMC final patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------- PUBLIC APP ----------
          p=Path('app.js')
          s=p.read_text()
          s=s.replace("vmc-member-api'", "vmc-member-api-v2'")
          s=s.replace("receipt_reference: data.receipt_reference.trim()\n", "receipt_reference: data.receipt_reference.trim(), rules_accepted: true, rules_version: 'VMC Rules v1.0'\n", 1)

          # Add public notification badge styling.
          css_marker="        .vmc-nav-auth button.vmc-nav-admin{background:transparent}\n"
          css_add="""        .vmc-nav-auth button.vmc-nav-admin{background:transparent}
        .vmc-nav-admin{position:relative}.vmc-attention-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:#e31b2d;color:#fff;font-size:.62rem;font-weight:1000;line-height:1}
"""
          if css_marker in s and '.vmc-attention-badge' not in s:
              s=s.replace(css_marker,css_add,1)

          new_reactivation="""  function renderReactivation(profile, email) {
    if ($('#loginView')) $('#loginView').hidden = true;
    if ($('#registerView')) $('#registerView').hidden = true;
    if ($('#successView')) $('#successView').hidden = false;
    if ($('#modalTitle')) $('#modalTitle').textContent = 'Membership Renewal';
    const view = $('#successView');
    if (!view) return;
    const tier = profile?.membership_tier || 'Per Month';
    const session = profile?.session_type || 'Single';
    view.innerHTML = `
      <div class="success">
        <div class="success-icon">!</div>
        <h2>Choose your new membership.</h2>
        <p>Your previous membership has expired. You can choose a different service for this renewal.</p>
        <div class="account-box"><div class="account-grid">
          <div><small>Member</small><strong>${esc(profile?.full_name || 'VMC Member')}</strong></div>
          <div><small>Email</small><strong>${esc(email || '')}</strong></div>
          <div><small>Previous service</small><strong>${esc(tier)} · ${esc(session)}</strong></div>
          <div><small>Payment</small><strong>Verified by VMC management after submission</strong></div>
        </div></div>
        <div class="grid2" style="margin-top:16px">
          <div class="field"><label>New membership</label><select id="reactivationTier"><option>Per Day</option><option>Per Week</option><option>Per Month</option></select></div>
          <div class="field"><label>Session</label><select id="reactivationSession"><option>Single</option><option>Double</option></select></div>
          <div class="field"><label>Payment channel</label><select id="reactivationPayment"><option>Airtel Money</option><option>TNM Mpamba</option><option>National Bank</option><option>Cash</option></select></div>
          <div class="field"><label>Receipt / Reference</label><input id="reactivationReference" autocomplete="off"></div>
        </div>
        <div class="status-box" style="margin-top:12px"><span class="status-label">Amount</span><span class="status-value" id="reactivationAmount">K 30,000</span></div>
        <label class="check" style="margin-top:16px"><input id="reactivationAgree" type="checkbox"><span>I agree to the selected membership service and understand that VMC management must verify my payment.</span></label>
        <div class="form-error" id="reactivationError" role="alert"></div>
        <div class="form-actions"><button class="btn btn-red" id="reactivateBtn" type="button">Submit Renewal</button><button class="btn btn-dark" id="reactivateClose" type="button">Sign Out</button></div>
      </div>`;
    $('#reactivationTier').value=tier; $('#reactivationSession').value=session;
    const updateAmount=()=>{const amount=priceFor($('#reactivationTier').value,$('#reactivationSession').value);$('#reactivationAmount').textContent=`K ${Number(amount).toLocaleString('en-MW')}`};
    $('#reactivationTier')?.addEventListener('change',updateAmount);$('#reactivationSession')?.addEventListener('change',updateAmount);updateAmount();
    $('#reactivationClose')?.addEventListener('click',signOut);
    $('#reactivateBtn')?.addEventListener('click', async () => {
      const errorBox=$('#reactivationError'), button=$('#reactivateBtn');
      if (!$('#reactivationAgree')?.checked) { setError(errorBox,'Please confirm the renewal choice and payment responsibility.'); return; }
      button.disabled=true;button.textContent='Submitting…';
      try { const {data,error}=await supabase.functions.invoke('vmc-member-api-v2',{body:{action:'reactivate',membership_tier:$('#reactivationTier').value,session_type:$('#reactivationSession').value,payment_channel:$('#reactivationPayment').value,receipt_reference:$('#reactivationReference').value.trim()}}); if(error)throw error;if(data?.error)throw new Error(data.error);const latest=await currentProfile();renderAccount(latest.profile,email);showToast('Renewal submitted. VMC management will verify the payment.'); }
      catch(err){setError(errorBox,friendlyError(err));button.disabled=false;button.textContent='Submit Renewal'}
    });
  }

  function renderPasswordRequired(profile,email) {
    if ($('#loginView')) $('#loginView').hidden=true;if ($('#registerView')) $('#registerView').hidden=true;if ($('#successView')) $('#successView').hidden=false;
    if ($('#modalTitle')) $('#modalTitle').textContent='Secure Your VMC Account';
    const view=$('#successView');if(!view)return;
    const security=profile?.security_action_required;
    view.innerHTML=`<div class="success"><div class="success-icon">!</div><h2>Change your password.</h2><p>${esc(profile?.security_notice || (security?'For your protection, VMC requires you to create a new password before continuing.':'This account was created by VMC management with an initial password. Please replace it now.'))}</p><div class="form" style="margin-top:16px"><div class="field"><label>Current password</label><input id="forcedCurrent" type="password" autocomplete="current-password"></div><div class="field"><label>New password</label><input id="forcedNew" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirm new password</label><input id="forcedConfirm" type="password" autocomplete="new-password" minlength="8"></div></div><div class="form-error" id="forcedError" role="alert"></div><div class="form-actions"><button class="btn btn-red" id="forcedSave" type="button">Change Password</button><button class="btn btn-dark" id="forcedSignOut" type="button">Sign Out</button></div></div>`;
    $('#forcedSignOut')?.addEventListener('click',signOut);
    $('#forcedSave')?.addEventListener('click',async()=>{const err=$('#forcedError'),button=$('#forcedSave');button.disabled=true;button.textContent='Updating…';try{const {data,error}=await supabase.functions.invoke('vmc-member-api-v2',{body:{action:'change-password',current_password:$('#forcedCurrent').value,new_password:$('#forcedNew').value,confirm_password:$('#forcedConfirm').value}});if(error)throw error;if(data?.error)throw new Error(data.error);const latest=await currentProfile();if(latest.profile?.account_status!=='active')throw new Error('This account is not active. Contact VMC management.');showToast('Password changed successfully.');renderAccount(latest.profile,email)}catch(e){setError(err,friendlyError(e));button.disabled=false;button.textContent='Change Password'}});
  }

  # Replace the login handler so forced password/security actions happen before normal access.
  start=s.index('  async function loginMember(event) {')
  end=s.index('  async function signOut()',start)
  new_login="""  async function loginMember(event) {
    event.preventDefault();
    const errorBox=$('#loginError'),submit=$('#loginSubmit'),email=($('#loginEmail')?.value||'').trim().toLowerCase(),password=$('#loginPassword')?.value||'';
    setError(errorBox,'');if(!email||!password){setError(errorBox,'Enter your email and password.');return}submit.disabled=true;submit.textContent='Signing in…';
    try{
      const {error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;
      const {user,profile}=await currentProfile();if(!user||!profile)throw new Error('Your authentication succeeded, but your VMC profile could not be loaded.');
      const management=Boolean(profile.is_admin)||['owner','manager','staff'].includes(profile.account_role);
      if(state.loginMode==='admin'&&!management){await supabase.auth.signOut();throw new Error('Admin access required. Use Member Login for a customer account.')}
      if(!management){
        if(profile.must_change_password||profile.security_action_required){renderPasswordRequired(profile,user.email);return}
        const {data:lifecycle,error:lifecycleError}=await supabase.functions.invoke('vmc-member-api-v2',{body:{action:'status'}});if(lifecycleError)throw lifecycleError;
        if(lifecycle?.must_change_password||lifecycle?.security_action_required){renderPasswordRequired(lifecycle.profile||profile,user.email);return}
        if(lifecycle?.status==='reactivation_required'){renderReactivation(lifecycle.profile||profile,user.email);return}
      }
      if(profile.account_status!=='active')throw new Error('This account is not active. Contact VMC management.');
      if(management){window.location.assign('dashboard.html');return}renderAccount(profile,user.email);
    }catch(error){console.error('VMC login error:',error);setError(errorBox,friendlyError(error))}finally{submit.disabled=false;submit.textContent='Sign In'}
  }

"""
  s=s[:start]+new_login+s[end:]

  # Add management notification count to the public Admin Login button; never expose it to anonymous visitors.
  marker="    links.appendChild(auth);\n"
  extra="""    links.appendChild(auth);
    const refreshManagementAttention=async()=>{
      try{const {data:{user}}=await supabase.auth.getUser();if(!user)return;const {data:profile}=await supabase.from('profiles').select('account_role,is_admin,account_status').eq('id',user.id).maybeSingle();if(!profile||profile.account_status!=='active'||(!profile.is_admin&&!['owner','manager','staff'].includes(profile.account_role)))return;const {data,error}=await supabase.functions.invoke('vmc-admin-api-v2',{body:{action:'attention-count'}});if(error||!data||!Number(data.count))return;admin.innerHTML='Admin Login <span class="vmc-attention-badge">'+Number(data.count)+'</span>'}catch(_){}}
    supabase.auth.onAuthStateChange(()=>{setTimeout(refreshManagementAttention,0)});
    refreshManagementAttention();
"""
  if marker in s:s=s.replace(marker,extra,1)
  p.write_text(s)

          # ---------- MANAGEMENT DASHBOARD ----------
          p=Path('dashboard.html')
          s=p.read_text()
          s=s.replace("const ADMIN_API=SUPABASE_URL+'/functions/v1/vmc-admin-api';","const ADMIN_API=SUPABASE_URL+'/functions/v1/vmc-admin-api-v2';",1)

          start=s.index('function renderOverview()')
          end=s.index('function renderCustomers()',start)
          new_overview="""function renderOverview(){const s=state.data?.stats||{};$('#sMembers').textContent=s.totalMembers??0;$('#sPayments').textContent=s.pendingPayments??0;$('#sApprovals').textContent=s.pendingApprovals??0;$('#sActive').textContent=s.active??0;$('#sExpiring').textContent=s.expiringSoon??0;$('#sExpired').textContent=s.expired??0;$('#sRenewals').textContent=s.pendingRenewals??0;const t=today(),soon=soonDate(),ms=state.data?.memberships||[],items=[];ms.filter(x=>x.registration_status==='Pending Approval').forEach(x=>items.push({c:'red',t:'Registration awaiting Owner/Admin approval',d:memberName(x.member_id),sec:'approvals'}));ms.filter(x=>x.payment_status==='Pending Payment Verification').forEach(x=>items.push({c:'red',t:'Payment awaiting Owner/Admin verification',d:memberName(x.member_id),sec:'approvals'}));ms.filter(x=>x.membership_status==='expired'||(x.expiry_date&&x.expiry_date<t)).forEach(x=>items.push({c:'red',t:'Membership expired',d:memberName(x.member_id)+' · '+fmtDate(x.expiry_date),sec:'renewals'}));ms.filter(x=>x.membership_status==='active'&&x.expiry_date>=t&&x.expiry_date<=soon).forEach(x=>items.push({c:'amber',t:'Membership expires within 7 days',d:memberName(x.member_id)+' · '+fmtDate(x.expiry_date),sec:'renewals'}));ms.filter(x=>x.creation_method==='Renewal'&&x.payment_status==='Pending Payment Verification').forEach(x=>items.push({c:'amber',t:'Renewal payment needs Owner/Admin verification',d:memberName(x.member_id),sec:'approvals'}));(state.data?.members||[]).filter(x=>x.security_action_required).forEach(x=>items.push({c:'red',t:'Customer security action required',d:x.full_name,sec:'customers'}));$('#attention').innerHTML=items.length?items.slice(0,20).map(x=>'<div class="attention-item"><i class="flag '+(x.c==='amber'?'amber':'')+'"></i><div><b>'+esc(x.t)+'</b><small>'+esc(x.d)+'</small></div><button class="btn dark" data-sec-link="'+x.sec+'">Open</button></div>').join(''):'<div class="empty">Nothing requires immediate attention.</div>'}
"""
          s=s[:start]+new_overview+s[end:]

          start=s.index('function renderCustomers()')
          end=s.index('function renderApprovals()',start)
          new_customers="""function renderCustomers(){let rows=state.data?.members||[],q=($('#search')?.value||'').toLowerCase(),f=$('#filter')?.value||'all',t=today(),soon=soonDate(),canSecure=state.caller?.is_admin||state.caller?.account_role==='owner';rows=rows.filter(m=>{const x=memFor(m.id),hay=(m.full_name+' '+(m.phone_number||'')).toLowerCase();if(q&&!hay.includes(q))return false;if(f==='pending'&&x?.payment_status!=='Pending Payment Verification')return false;if(f==='active'&&x?.membership_status!=='active')return false;if(f==='inactive'&&m.account_status==='active')return false;if(f==='expired'&&!(x?.membership_status==='expired'||x?.expiry_date<t))return false;if(f==='expiring'&&!(x?.expiry_date>=t&&x?.expiry_date<=soon))return false;return true});$('#customersRows').innerHTML=rows.length?rows.map(m=>{const x=memFor(m.id),method=x?.creation_method||'Self Registration';return '<tr><td class="person"><b>'+esc(m.full_name||'Unnamed')+'</b><small>'+esc(m.phone_number||'')+'</small></td><td>'+esc(x?.membership_tier||m.membership_tier||'—')+' / '+esc(x?.session_type||m.session_type||'—')+'</td><td><span class="badge '+(x?.payment_status==='Payment Verified'?'g':x?.payment_status==='Payment Rejected'?'r':'a')+'">'+esc(x?.payment_status||m.payment_status||'—')+'</span></td><td><span class="badge '+(m.registration_status==='Approved'?'g':m.registration_status==='Rejected'?'r':'a')+'">'+esc(m.registration_status||'—')+'</span></td><td>'+esc(method)+(x?.created_by?'<br><small>Management initiated</small>':'')+'</td><td>'+fmtDate(x?.expiry_date||m.membership_expiry_date)+'</td><td><span class="badge '+(m.account_status==='active'?'g':'r')+'">'+esc(m.account_status||'—')+'</span></td><td><div class="rowactions"><button class="btn dark" data-act="password" data-id="'+m.id+'">Password</button>'+ (canSecure?'<button class="btn amber" data-act="security" data-id="'+m.id+'">Security</button>':'') +'<button class="btn '+(m.account_status==='active'?'danger':'green')+'" data-act="status" data-id="'+m.id+'" data-status="'+(m.account_status==='active'?'inactive':'active')+'">'+(m.account_status==='active'?'Deactivate':'Activate')+'</button><button class="btn danger" data-act="delete-customer" data-id="'+m.id+'">Delete</button></div></td></tr>'}).join(''):'<tr><td colspan="8" class="empty">No customers found.</td></tr>'}
"""
          s=s[:start]+new_customers+s[end:]

          start=s.index('function renderApprovals()')
          end=s.index('function renderRenewals()',start)
          new_approvals="""function renderApprovals(){const rows=(state.data?.memberships||[]).filter(x=>x.registration_status==='Pending Approval'||x.payment_status==='Pending Payment Verification'),canApprove=state.caller?.is_admin||state.caller?.account_role==='owner';$('#approvalRows').innerHTML=rows.length?rows.map(x=>'<tr><td class="person"><b>'+esc(memberName(x.member_id))+'</b><small>'+esc((state.data.members||[]).find(m=>m.id===x.member_id)?.phone_number||'')+'</small></td><td>'+esc(x.membership_tier||'—')+' / '+esc(x.session_type||'—')+'</td><td>K'+Number(x.amount||0).toLocaleString()+'</td><td>'+esc(x.payment_channel||'—')+'</td><td>'+esc(x.receipt_reference||'—')+'</td><td><span class="badge '+(x.registration_status==='Approved'?'g':x.registration_status==='Rejected'?'r':'a')+'">'+esc(x.registration_status||'—')+'</span></td><td><span class="badge '+(x.payment_status==='Payment Verified'?'g':x.payment_status==='Payment Rejected'?'r':'a')+'">'+esc(x.payment_status||'—')+'</span></td><td><div class="rowactions">'+(canApprove?(x.registration_status==='Pending Approval'?'<button class="btn green" data-act="approve" data-id="'+x.id+'" data-member="'+x.member_id+'">Approve</button><button class="btn danger" data-act="reject" data-id="'+x.id+'">Reject</button>':'')+(x.payment_status==='Pending Payment Verification'?'<button class="btn green" data-act="verify" data-id="'+x.id+'">Verify Payment</button><button class="btn danger" data-act="reject-payment" data-id="'+x.id+'">Reject Payment</button>':''):'<small class="badge a">Owner/Admin action</small>')+'</div></td></tr>').join(''):'<tr><td colspan="8" class="empty">No pending approvals or payments.</td></tr>'}
"""
          s=s[:start]+new_approvals+s[end:]

          start=s.index('function renderStaff()')
          end=s.index('function renderAll()',start)
          new_staff="""function renderStaff(){const all=state.data?.staff||[],visible=all;const role=state.caller?.is_admin?'admin':state.caller?.account_role;$('#staffRows').innerHTML=visible.length?visible.map(x=>{const protectedUser=x.is_admin||x.id===state.user.id||(!state.caller.is_admin&&x.account_role==='owner');let options='';if(role==='admin')options='<option value="owner">Owner</option><option value="manager">Manager</option><option value="staff">Staff</option>';else if(role==='owner')options='<option value="manager">Manager</option><option value="staff">Staff</option>';else if(role==='manager')options='<option value="manager">Manager</option><option value="staff">Staff</option>';else options='<option value="staff">Staff</option>';return '<tr><td class="person"><b>'+esc(x.full_name||'Unnamed')+'</b><small>'+esc(x.phone_number||'')+'</small></td><td><select data-act="role" data-id="'+x.id+'" '+(protectedUser?'disabled':'')+'>'+options.replace('value="'+x.account_role+'"','value="'+x.account_role+'" selected')+'</select></td><td><span class="badge '+(x.account_status==='active'?'g':'r')+'">'+esc(x.account_status||'—')+'</span></td><td>'+fmtDate(String(x.created_at||'').slice(0,10))+'</td><td><div class="rowactions">'+(!protectedUser&&(state.caller.is_admin||x.account_role!=='owner')?'<button class="btn '+(x.account_status==='active'?'danger':'green')+'" data-act="staff-status" data-id="'+x.id+'" data-status="'+(x.account_status==='active'?'inactive':'active')+'">'+(x.account_status==='active'?'Deactivate':'Activate')+'</button><button class="btn dark" data-act="password-staff" data-id="'+x.id+'">Password</button><button class="btn danger" data-act="delete-staff" data-id="'+x.id+'">Delete</button>':'')+'</div></td></tr>'}).join(''):'<tr><td colspan="5" class="empty">No management accounts visible to your role.</td></tr>'}
"""
          s=s[:start]+new_staff+s[end:]

          # Add security modal and route it through the server-enforced Owner/Admin action.
          marker="function openPassword(id){"
          security_fn="""function openSecurity(id){openModal('Security Action','<form class="form" id="securityForm"><div class="error" id="formErr"></div><div class="field"><label>Security notice</label><textarea name="notice" rows="4" style="background:#0b0c0f;color:#fff;border:1px solid #33373e;border-radius:6px;padding:8px;outline:0" required>A security issue was detected on your VMC account. Please change your password before continuing.</textarea></div><button class="btn red" type="submit">Require Password Change</button></form>');$('#securityForm').onsubmit=async e=>{e.preventDefault();try{await api('flag-security',{user_id:id,notice:new FormData(e.currentTarget).get('notice')});closeModal();toast('Security action issued.');await load()}catch(err){$('#formErr').textContent=err.message;$('#formErr').classList.add('show')}}}\n"""
          if marker in s and 'function openSecurity(id)' not in s:s=s.replace(marker,security_fn+marker,1)
          s=s.replace("if(type==='password'||type==='password-staff'){openPassword(b.dataset.id);return}","if(type==='password'||type==='password-staff'){openPassword(b.dataset.id);return}if(type==='security'){openSecurity(b.dataset.id);return}",1)

          start=s.index('function openCustomer()')
          end=s.index('function openStaff()',start)
          new_customer="""function openCustomer(){const isAdmin=state.caller?.is_admin===true;openModal('Add Customer','<form class="form" id="customerForm"><div class="notice">Manual customer creation follows the same onboarding data requirements as public registration. The customer will remain pending Owner/Admin approval and payment verification, and must change the initial password at first login.</div><div class="error" id="formErr"></div><div class="grid2"><div class="field"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Date of birth</label><input name="date_of_birth" type="date" required></div><div class="field"><label>Gender</label><select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Phone</label><input name="phone_number" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Emergency contact</label><input name="emergency_contact" required></div><div class="field"><label>Initial password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Membership</label><select name="membership_tier"><option>Per Day</option><option>Per Week</option><option>Per Month</option></select></div><div class="field"><label>Session</label><select name="session_type"><option>Single</option><option>Double</option></select></div><div class="field"><label>Payment Channel</label><select name="payment_channel"><option>Airtel Money</option><option>TNM Mpamba</option><option>National Bank</option><option>Cash</option></select></div><div class="field"><label>Receipt / Reference</label><input name="receipt_reference"></div></div><label style="display:flex;gap:8px;align-items:flex-start;font-size:.72rem;margin-top:4px"><input name="rules_accepted" type="checkbox" value="true" required><span>Customer has been taken through and accepts the current VMC rules.</span></label><input type="hidden" name="rules_version" value="VMC Rules v1.0"><button class="btn red" type="submit">Create Customer</button></form>');$('#customerForm').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.currentTarget));data.rules_accepted=true;await api('create-member',data);closeModal();toast('Customer created. Pending Owner/Admin approval and payment verification.');await load()}catch(err){$('#formErr').textContent=err.message;$('#formErr').classList.add('show')}}}\n"""
          s=s[:start]+new_customer+s[end:]

          # Keep renewal creation available to management, with service selection already present.
          s=s.replace("toast('Renewal created and flagged for payment verification.')","toast('Renewal created and flagged for Owner/Admin payment verification.')",1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "VMC Xtreme Automation"
          git config user.email "actions@github.com"
          git add dashboard.html app.js
          git diff --cached --quiet || git commit -m "implement subscription choice security onboarding and role visibility"
          git push
          rm -f .github/workflows/vmc-final-patch.yml
          git add .github/workflows/vmc-final-patch.yml
          git commit -m "remove one-time VMC UI patch workflow"
          git push
