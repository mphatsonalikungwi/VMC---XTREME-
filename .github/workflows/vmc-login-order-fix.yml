name: VMC login order fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair login order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text()
          pattern=r"(const \{ user, profile \} = await currentProfile\(\);\s*if \(!user \|\| !profile\) throw new Error\([^;]+;\s*)(?:if \(!management\) \{.*?\n\s*\}\s*)?(if \(profile\.account_status !== 'active'\) throw new Error\('This account is not active\. Contact VMC management\.'\);\s*)const management = Boolean\(profile\.is_admin\) \|\| \['owner', 'manager', 'staff'\]\.includes\(profile\.account_role\);"
          replacement=r"\1const management = Boolean(profile.is_admin) || ['owner', 'manager', 'staff'].includes(profile.account_role);\n      if (!management) {\n        const { data: lifecycle, error: lifecycleError } = await supabase.functions.invoke('vmc-member-api', { body: { action: 'status' } });\n        if (lifecycleError) throw lifecycleError;\n        if (lifecycle?.status === 'reactivation_required') { renderReactivation(lifecycle.profile || profile, user.email); return; }\n      }\n      \2"
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'login order pattern not found: {n}')
          p.write_text(ns)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "VMC Xtreme Automation"
          git config user.email "actions@github.com"
          git add app.js
          git diff --cached --quiet || git commit -m "fix member login lifecycle order"
          git push
          rm -f .github/workflows/vmc-login-order-fix.yml
          git add .github/workflows/vmc-login-order-fix.yml
          git commit -m "remove login order patch workflow"
          git push
