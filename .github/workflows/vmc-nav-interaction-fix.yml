name: VMC Navigation Interaction Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore-registration:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove later registration overrides only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          remove_scripts=['VMC_CLOUDFLARE_UI_PATCH','VMC_UI_FIXES_V2','VMC_FINAL_HARDENING','VMC_PRODUCTION_CUSTOMER_FIXES','VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT']
          remove_styles=['VMC_REGISTRATION_FINAL_LAYOUT_FIX']
          for sid in remove_scripts:
              s=re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>\s*','',s,flags=re.S)
          for sid in remove_styles:
              s=re.sub(r'<style id="'+re.escape(sid)+r'">.*?</style>\s*','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify previous registration implementation remains
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'VMC_REGISTRATION_ALIGNMENT' in s
          assert 'vmc-registration-api' in s
          assert 'Payment Reference <span class="vmc-email-optional">(Optional)</span>' in s
          assert 'Emergency Contact' in s
          assert 'name="username"' not in s[s.find('<script id="VMC_REGISTRATION_ALIGNMENT">'):s.find('</script>',s.find('<script id="VMC_REGISTRATION_ALIGNMENT">'))]
          for x in ['VMC_CLOUDFLARE_UI_PATCH','VMC_UI_FIXES_V2','VMC_FINAL_HARDENING','VMC_PRODUCTION_CUSTOMER_FIXES','VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT']:
              assert x not in s,x
          print('Previous registration implementation verified.')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore previous registration form design'
          git push
