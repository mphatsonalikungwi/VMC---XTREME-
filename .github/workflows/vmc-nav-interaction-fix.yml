name: VMC Navigation Interaction Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-navigation:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply authorized registration repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for sid in ['VMC_CLOUDFLARE_UI_PATCH','VMC_UI_FIXES_V2','VMC_REGISTRATION_ALIGNMENT','VMC_FINAL_HARDENING','VMC_CUSTOMER_EXPERIENCE','VMC_AUTH_IDENTIFIER','VMC_PRODUCTION_CUSTOMER_FIXES','VMC_REGISTRATION_LAYOUT_UPGRADE_SCRIPT','VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT']:
              s=re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>\\s*','',s,flags=re.S)
          for sid in ['VMC_REGISTRATION_LAYOUT_UPGRADE','VMC_REGISTRATION_FINAL_LAYOUT_FIX']:
              s=re.sub(r'<style id="'+re.escape(sid)+r'">.*?</style>\\s*','',s,flags=re.S)
          s=re.sub(r'async function uploadAvatar\\(sb,file,userId\\)\\{.*?\\}\\n','',s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(!d.payment_channel)return'Please select a payment channel.';if(!$('#rulesCheck')?.checked)","if(!d.payment_channel)return'Please select a payment channel.';if(!d.emergency_contact?.trim())return'Emergency contact is required for member safety.';if(!$('#rulesCheck')?.checked)")
          s=s.replace("['fullName','phoneNumber','registerEmail','registerPassword','tier','session','paymentChannel','receiptReference']","['fullName','phoneNumber','registerEmail','registerPassword','tier','session','paymentChannel']")
          start=s.index('async function registerMember(e){')
          end=s.index('async function loginMember',start)
          fn="""async function registerMember(e){e.preventDefault();const f=e.currentTarget,err=$('#registerError'),submit=$('#registerSubmit'),d=Object.fromEntries(new FormData(f).entries()),ve=validateRegistration(d);setError(err,ve);if(ve)return;submit.disabled=true;submit.textContent='Creating account…';try{const tier=d.membership_tier,session=d.session_type,duration=Math.max(1,Math.min(3650,parseInt(d.duration_count,10)||1)),unit=d.duration_unit||({'Per Day':'day','Per Week':'week','Per Month':'month'}[tier]||'month'),amount=priceFor(tier,session)*duration;if(!amount)throw Error('The selected membership price could not be determined.');const payload={full_name:String(d.full_name).trim(),phone_number:String(d.phone_number).trim(),email:String(d.email||'').trim().toLowerCase(),password:d.password,date_of_birth:String(d.date_of_birth||'').trim(),gender:String(d.gender||'').trim(),emergency_contact:String(d.emergency_contact||'').trim(),membership_tier:tier,session_type:session,duration_count:duration,duration_unit:unit,payment_channel:d.payment_channel,receipt_reference:String(d.receipt_reference||'').trim(),rules_accepted:true,rules_version:'VMC Rules v1.0'};const {data,error}=await supabase.functions.invoke('vmc-registration-api',{body:payload});if(error)throw error;if(data?.error)throw Error(data.error);const username=String(data?.username||'');const profile={full_name:d.full_name,membership_tier:tier,session_type:session,payment_channel:d.payment_channel,receipt_reference:d.receipt_reference||'',payment_status:'Pending Payment Verification',username};renderSuccess(profile,d.email||'');f.reset();state.selectedPlan=null;if($('#selectedPlanText'))$('#selectedPlanText').textContent='Choose a plan below or continue with your details.';window.vmcSetRegistrationStep?.(1)}catch(e){console.error('VMC registration error:',e);setError(err,friendlyError(e))}finally{submit.disabled=false;submit.textContent='Complete Registration'}}
"""
          s=s[:start]+fn+s[end:]
          s=s.replace('<div class="account-grid"><div><small>Member</small>','<div class="account-grid"><div><small>VMC Username</small><strong>${esc(profile?.username||\'Generated automatically\')}</strong></div><div><small>Member</small>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          j=Path('app.js').read_text(encoding='utf-8')
          for x in ['VMC_CLOUDFLARE_UI_PATCH','VMC_UI_FIXES_V2','VMC_REGISTRATION_ALIGNMENT','VMC_FINAL_HARDENING','VMC_PRODUCTION_CUSTOMER_FIXES','VMC_REGISTRATION_LAYOUT_UPGRADE_SCRIPT','VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT']:
              assert x not in h, x
          assert "if(!d.emergency_contact?.trim())" in j
          assert "if(!d.receipt_reference?.trim())" not in j
          assert 'vmc-registration-api' in j
          print('registration repair verified')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore previous registration design and runtime"
          git push
