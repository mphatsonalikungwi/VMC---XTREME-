name: VMC Registration Two-Step Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair registration journey and build pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Remove registration-specific generated scripts from the public HTML.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for sid in ['VMC_CLOUDFLARE_UI_PATCH','VMC_UI_FIXES_V2','VMC_REGISTRATION_ALIGNMENT','VMC_REGISTRATION_WIZARD','VMC_PRODUCTION_CUSTOMER_FIXES']:
              s=re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')

          # Stop future Cloudflare builds from re-injecting the two broad scripts into the public page.
          p=Path('cloudflare-build.mjs')
          build=p.read_text(encoding='utf-8')
          build=build.replace("index=upsert(index,'VMC_CLOUDFLARE_UI_PATCH',tag('VMC_CLOUDFLARE_UI_PATCH',patch));",'')
          build=build.replace("index=upsert(index,'VMC_UI_FIXES_V2',fixesV2Tag);",'')
          p.write_text(build,encoding='utf-8')

          # Replace the old registration wizard with one canonical two-page journey:
          # Page 1 = required information; Page 2 = optional information.
          p=Path('app.js')
          js=p.read_text(encoding='utf-8')
          start=js.index('function setupRegistrationWizard(){')
          end=js.index('function setupNavigation(){',start)
          fn=r'''function setupRegistrationWizard(){
          const f=$('#registerForm'),grid=f&&$('.form-grid',f);if(!f||!grid||f.dataset.vmcWizard==='2')return;f.dataset.vmcWizard='2';
          const fields={};$$('.field',grid).forEach(el=>{const input=$('input,select',el);if(input?.id)fields[input.id]=el});
          const rulesLabel=$('#rulesCheck')?.closest('.check');
          const actions=f.querySelector('.form-actions');
          const submit=actions?.querySelector('#registerSubmit');
          const err=$('#registerError');
          const step1=document.createElement('div'),step2=document.createElement('div');
          step1.className='vmc-reg-step';step2.className='vmc-reg-step';step1.id='vmcRegStep1';step2.id='vmcRegStep2';step2.hidden=true;
          const progress=document.createElement('div');progress.className='vmc-reg-progress';progress.innerHTML='<span id="vmcRegInd1" class="active"><b>1</b> Required information</span><span id="vmcRegInd2"><b>2</b> Optional information</span>';
          const welcome=document.createElement('div');welcome.className='vmc-reg-welcome';welcome.innerHTML='<div class="vmc-reg-welcome-kicker">WELCOME TO VMC XTREME FITNESS</div><h3>Start your VMC journey today.</h3><p>You are one step away from joining a stronger, healthier community. Choose the membership that fits you, tell us how to reach you, and create your secure account. We will guide you through the rest.</p>';
          const membership=document.createElement('div');membership.className='vmc-reg-section vmc-reg-membership';membership.innerHTML='<h4>Choose your membership</h4><p class="vmc-reg-section-copy">Select the service and session that best fits your training goals.</p>';
          const add=(parent,id)=>{if(fields[id])parent.appendChild(fields[id])};
          add(membership,'tier');add(membership,'session');
          const durationField=document.createElement('div');durationField.className='field';durationField.innerHTML='<label for="vmcDuration">Duration</label><input id="vmcDuration" name="duration_count" type="number" min="1" max="3650" value="1" inputmode="numeric" required><small id="vmcDurationHint" class="vmc-reg-hint">Select a membership to set the duration unit.</small><input id="vmcDurationUnit" name="duration_unit" type="hidden" value="month">';membership.appendChild(durationField);
          const priceBox=document.createElement('div');priceBox.className='vmc-reg-price';priceBox.innerHTML='<span>Membership total</span><strong id="calculatedTotal">K 30,000</strong>';membership.appendChild(priceBox);
          const selected=$('#selectedPlanText')?.closest('.selected-plan');if(selected){selected.querySelector('small')?.replaceChildren(document.createTextNode('SELECTED MEMBERSHIP'));const strong=$('#selectedPlanText',selected);if(strong)strong.textContent='Choose a membership above to get started.';}
          step1.append(welcome);if(selected)step1.append(selected);step1.append(membership);
          add(step1,'fullName');add(step1,'phoneNumber');add(step1,'emergencyContact');add(step1,'registerPassword');
          const payment=document.createElement('div');payment.className='vmc-reg-section';payment.innerHTML='<h4>Payment</h4><p class="vmc-reg-section-copy">Choose how you will pay. VMC management will verify the payment before activating your membership.</p>';add(payment,'paymentChannel');step1.append(payment);
          if(rulesLabel){rulesLabel.classList.add('vmc-reg-rules');step1.append(rulesLabel)}
          const nextWrap=document.createElement('div');nextWrap.className='vmc-reg-actions';nextWrap.innerHTML='<button class="btn btn-red" id="vmcNextStep" type="button">Continue to optional details →</button>';step1.append(nextWrap);
          const optionalIntro=document.createElement('div');optionalIntro.className='vmc-reg-optional-intro';optionalIntro.innerHTML='<h3>Tell us a little more about you.</h3><p>These details are optional. You can provide them now to help us keep your member profile complete, or leave them blank and continue.</p>';
          step2.append(optionalIntro);add(step2,'registerEmail');add(step2,'dateOfBirth');add(step2,'gender');
          const reference=document.createElement('div');reference.className='vmc-reg-section';reference.innerHTML='<h4>Payment reference <span>(Optional)</span></h4><p class="vmc-reg-section-copy">If you have already paid, you can enter your transaction, deposit or receipt reference here.</p>';add(reference,'receiptReference');step2.append(reference);
          const step2Actions=document.createElement('div');step2Actions.className='vmc-reg-actions';const back=document.createElement('button');back.type='button';back.className='btn btn-dark';back.textContent='← Back';
          if(submit){submit.type='submit';submit.textContent='Create My Account';step2Actions.append(back,submit)}else{const b=document.createElement('button');b.type='submit';b.className='btn btn-red';b.id='registerSubmit';b.textContent='Create My Account';step2Actions.append(back,b)}step2.append(step2Actions);
          const skip=document.createElement('button');skip.type='button';skip.className='vmc-reg-skip';skip.textContent='Skip optional details and create my account';step2.append(skip);
          grid.replaceChildren(step1,step2);f.insertBefore(progress,f.firstChild);if(err)f.appendChild(err);if(actions)actions.remove();
          const style=document.createElement('style');style.id='vmcRegistrationStyles';style.textContent=`
          .vmc-reg-progress{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}.vmc-reg-progress span{padding:10px 12px;border:1px solid #2a2d34;border-radius:12px;color:#737780;background:#0b0c0f;font-size:.68rem;font-weight:900}.vmc-reg-progress span.active{border-color:#7b1e28;background:#1b1114;color:#ff6673}.vmc-reg-progress b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-right:6px;background:#272a30;color:#fff}.vmc-reg-progress span.active b{background:#e31b2d}.vmc-reg-step[hidden]{display:none}.vmc-reg-step{display:grid;gap:13px}.vmc-reg-welcome{padding:17px 16px 15px;border:1px solid #4b1b23;background:linear-gradient(135deg,#211115,#171318);border-radius:15px}.vmc-reg-welcome-kicker{color:#ff5b68;font-size:.63rem;font-weight:950;letter-spacing:.14em}.vmc-reg-welcome h3,.vmc-reg-optional-intro h3{margin:6px 0 6px;font-size:1.25rem;line-height:1.15;text-transform:none}.vmc-reg-welcome p,.vmc-reg-optional-intro p{margin:0;color:#c5c8ce;font-size:.8rem;line-height:1.55}.vmc-reg-section{border-top:1px solid #2a2d34;padding-top:15px;margin-top:2px}.vmc-reg-section h4{margin:0 0 5px;color:#ff4050;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}.vmc-reg-section h4 span{color:#858991;font-size:.65rem;letter-spacing:0;text-transform:none}.vmc-reg-section-copy{margin:0 0 11px;color:#9498a0;font-size:.74rem;line-height:1.45}.vmc-reg-membership{border-top:0;padding-top:2px}.vmc-reg-price{background:#17191e;border:1px solid #30343b;border-left:4px solid #e31b2d;padding:12px 13px;margin-top:2px;border-radius:11px}.vmc-reg-price span{display:block;color:#92969e;font-size:.68rem}.vmc-reg-price strong{display:block;font-size:1.35rem;margin-top:2px}.vmc-reg-hint{display:block;color:#92969e;font-size:.68rem;margin-top:5px}.vmc-reg-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}.vmc-reg-actions .btn{flex:1;min-width:150px}.vmc-reg-skip{display:block;border:0;background:none;color:#92969e;text-decoration:underline;font-size:.74rem;text-align:center;margin-top:0}.vmc-reg-optional-intro{padding:16px;border:1px solid #2e3239;background:#15171b;border-radius:14px}.vmc-reg-rules{display:flex;align-items:flex-start;gap:9px;color:#c7cad0;font-size:.78rem}.vmc-reg-rules input{margin-top:4px;accent-color:#e31b2d}@media(max-width:760px){.vmc-reg-progress{font-size:.62rem}.vmc-reg-progress span{padding:9px 8px}.vmc-reg-actions{flex-direction:column}.vmc-reg-actions .btn{width:100%}.vmc-reg-welcome h3,.vmc-reg-optional-intro h3{font-size:1.12rem}}
          `;document.head.appendChild(style);
          const updatePrice=()=>{const tier=$('#tier')?.value,session=$('#session')?.value,count=Math.max(1,Math.min(3650,parseInt($('#vmcDuration')?.value,10)||1)),unit=tier==='Per Day'?'day':tier==='Per Week'?'week':'month',base=priceFor(tier,session)||0;$('#vmcDuration').value=count;$('#vmcDurationUnit').value=unit;$('#vmcDurationHint').textContent=tier?`Duration is counted in ${unit}${count===1?'':'s'}.`:'Select a membership to set the duration unit.';$('#calculatedTotal').textContent=`K ${(base*count).toLocaleString('en-MW')}`;if(tier&&session)$('#selectedPlanText').textContent=`${tier} · ${session} Session · ${count} ${unit}${count===1?'':'s'} · K ${(base*count).toLocaleString('en-MW')}`};
          const setStep=n=>{const first=n===1;step1.hidden=!first;step2.hidden=first;$('#vmcRegInd1').classList.toggle('active',first);$('#vmcRegInd2').classList.toggle('active',!first);if(first)$('#vmcNextStep')?.focus();else $('#registerSubmit')?.focus();f.scrollTop=0};
          const validateStep1=()=>{for(const id of ['fullName','phoneNumber','emergencyContact','registerPassword','tier','session','vmcDuration','paymentChannel']){const el=$(`#${id}`);if(el&&!el.checkValidity()){el.reportValidity();return false}}if(!$('#rulesCheck')?.checked){setError(err,'You must agree to all 15 VMC gym rules before continuing.');return false}setError(err,'');return true};
          window.vmcUpdateRegistrationPrice=updatePrice;window.vmcSetRegistrationStep=setStep;['tier','session','vmcDuration'].forEach(id=>document.getElementById(id)?.addEventListener(id==='vmcDuration'?'input':'change',updatePrice));
          nextWrap.querySelector('#vmcNextStep').onclick=()=>{if(validateStep1())setStep(2)};back.onclick=()=>setStep(1);skip.onclick=()=>{if(validateStep1())f.requestSubmit()};updatePrice();setStep(1)
          }
          '''
          js=js[:start]+fn+js[end:]
          # Keep registration's canonical submit handler; no registration-side username logic.
          js=js.replace("submit.textContent='Complete Registration'","submit.textContent='Create My Account'")
          p.write_text(js,encoding='utf-8')
          PY
      - name: Validate the repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8'); app=Path('app.js').read_text(encoding='utf-8'); build=Path('cloudflare-build.mjs').read_text(encoding='utf-8')
          start=app.index('function setupRegistrationWizard(){'); end=app.index('function setupNavigation(){',start); wiz=app[start:end]
          regstart=app.index('async function registerMember(e){'); regend=app.index('async function loginMember(e){',regstart); reg=app[regstart:regend]
          assert 'VMC_CLOUDFLARE_UI_PATCH' not in index and 'VMC_UI_FIXES_V2' not in index
          assert "invoke('vmc-registration-api'" in reg and 'supabase.auth.signUp' not in reg
          assert 'emergency_contact' in reg
          assert '1</b> Required information' in wiz and '2</b> Optional information' in wiz
          assert 'Welcome to VMC Xtreme Fitness' in wiz
          assert 'Choose your membership' in wiz
          assert "['fullName','phoneNumber','emergencyContact','registerPassword','tier','session','vmcDuration','paymentChannel']" in wiz
          assert "add(step2,'registerEmail')" in wiz and "add(step2,'dateOfBirth')" in wiz and "add(step2,'gender')" in wiz and "add(reference,'receiptReference')" in wiz
          assert "index=upsert(index,'VMC_CLOUDFLARE_UI_PATCH'" not in build and "index=upsert(index,'VMC_UI_FIXES_V2'" not in build
          print('Two-step registration validation passed.')
          PY
      - name: Remove one-time repair workflow
        run: rm -f .github/workflows/vmc-nav-interaction-fix.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild registration as a two-step member journey'
          git push
