name: VMC Navigation Interaction Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore-registration:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve previous registration design and finish authorized data handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="payment_channel:d.payment_channel,rules_accepted:true,rules_version:'VMC Rules v1.0'"
          new="payment_channel:d.payment_channel,receipt_reference:String(d.receipt_reference||'').trim(),rules_accepted:true,rules_version:'VMC Rules v1.0'"
          if old not in s: raise SystemExit('Registration payload anchor not found')
          s=s.replace(old,new,1)
          old2='${esc(d.username)}'
          new2='${esc(data?.username||\'Generated automatically\')}'
          if old2 not in s: raise SystemExit('Registration username display anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify authorized registration data handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'VMC_REGISTRATION_ALIGNMENT' in s
          assert 'receipt_reference:String(d.receipt_reference||\'\').trim()' in s
          assert "data?.username||'Generated automatically'" in s
          assert 'name="username"' not in s[s.find('<script id="VMC_REGISTRATION_ALIGNMENT">'):s.find('</script>',s.find('<script id="VMC_REGISTRATION_ALIGNMENT">'))]
          print('Registration data handoff verified.')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Complete authorized registration data handoff'
          git push
