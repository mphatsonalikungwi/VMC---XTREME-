name: VMC Navigation Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-navigation:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply authorized registration repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          for sid in ['VMC_CLOUDFLARE_UI_PATCH','VMC_UI_FIXES_V2','VMC_REGISTRATION_ALIGNMENT','VMC_FINAL_HARDENING','VMC_CUSTOMER_EXPERIENCE','VMC_AUTH_IDENTIFIER','VMC_PRODUCTION_CUSTOMER_FIXES','VMC_REGISTRATION_LAYOUT_UPGRADE_SCRIPT','VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT']:
              html=re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>\s*','',html,flags=re.S)
          for sid in ['VMC_REGISTRATION_LAYOUT_UPGRADE','VMC_REGISTRATION_FINAL_LAYOUT_FIX']:
              html=re.sub(r'<style id="'+re.escape(sid)+r'">.*?</style>\s*','',html,flags=re.S)
          html=re.sub(r'async function uploadAvatar\(sb,file,userId\)\{.*?\}\n','',html,count=1,flags=re.S)
          Path('index.html').write_text(html,encoding='utf-8')

          p=Path('app.js')
          js=p.read_text(encoding='utf-8')
          js=js.replace("if(!d.payment_channel)return'Please select a payment channel.';if(!$('#rulesCheck')?.checked)","if(!d.payment_channel)return'Please select a payment channel.';if(!d.emergency_contact?.trim())return'Emergency contact is required for member safety.';if(!$('#rulesCheck')?.checked)")
          js=js.replace("['fullName','phoneNumber','registerEmail','registerPassword','tier','session','paymentChannel','receiptReference']","['fullName','phoneNumber','registerEmail','registerPassword','tier','session','paymentChannel']")
          override="""
async function registerMember(e){e.preventDefault();const f=e.currentTarget,err=$('#registerError'),submit=$('#registerSubmit'),d=Object.fromEntries(new FormData(f).entries()),ve=validateRegistration(d);setError(err,ve);if(ve)return;submit.disabled=true;submit.textContent='Creating account…';try{const tier=d.membership_tier,session=d.session_type,duration=Math.max(1,Math.min(3650,parseInt(d.duration_count,10)||1)),unit=d.duration_unit||({'Per Day':'day','Per Week':'week','Per Month':'month'}[tier]||'month');const payload={full_name:String(d.full_name).trim(),phone_number:String(d.phone_number).trim(),email:String(d.email||'').trim().toLowerCase(),password:d.password,date_of_birth:String(d.date_of_birth||'').trim(),gender:String(d.gender||'').trim(),emergency_contact:String(d.emergency_contact||'').trim(),membership_tier:tier,session_type:session,duration_count:duration,duration_unit:unit,payment_channel:d.payment_channel,receipt_reference:String(d.receipt_reference||'').trim(),rules_accepted:true,rules_version:'VMC Rules v1.0'};const {data,error}=await supabase.functions.invoke('vmc-registration-api',{body:payload});if(error)throw error;if(data?.error)throw Error(data.error);const profile={full_name:d.full_name,membership_tier:tier,session_type:session,payment_channel:d.payment_channel,receipt_reference:d.receipt_reference||'',payment_status:'Payment being reviewed',username:String(data?.username||'')};renderSuccess(profile,d.email||'');f.reset();state.selectedPlan=null;if($('#selectedPlanText'))$('#selectedPlanText').textContent='Choose a plan below or continue with your details.';window.vmcSetRegistrationStep?.(1)}catch(e){console.error('VMC registration error:',e);setError(err,friendlyError(e))}finally{submit.disabled=false;submit.textContent='Complete Registration'}}
"""
          marker='/* VMC NAV INTERACTION HARDENING */'
          if 'VMC_AUTHORIZED_REGISTRATION_REPAIR' not in js:
              js=js.replace(marker,"const VMC_AUTHORIZED_REGISTRATION_REPAIR=true;\n"+override+marker,1)
          p.write_text(js,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8'); j=Path('app.js').read_text(encoding='utf-8')
          for x in ['VMC_CLOUDFLARE_UI_PATCH','VMC_UI_FIXES_V2','VMC_REGISTRATION_ALIGNMENT','VMC_FINAL_HARDENING','VMC_PRODUCTION_CUSTOMER_FIXES','VMC_REGISTRATION_LAYOUT_UPGRADE_SCRIPT','VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT']:
              assert x not in h,x
          assert "if(!d.emergency_contact?.trim())" in j
          assert "if(!d.receipt_reference?.trim())" not in j
          assert 'vmc-registration-api' in j
          assert 'VMC_AUTHORIZED_REGISTRATION_REPAIR' in j
          print('registration repair verified')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore previous registration design and runtime"
          git push
