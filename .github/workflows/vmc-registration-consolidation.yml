name: VMC Registration Consolidation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  consolidate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate registration runtime and remove duplicate handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Remove registration-related generated script blocks from the public page.
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          for sid in [
              'VMC_CLOUDFLARE_UI_PATCH',
              'VMC_UI_FIXES_V2',
              'VMC_REGISTRATION_ALIGNMENT',
              'VMC_REGISTRATION_WIZARD',
              'VMC_PRODUCTION_CUSTOMER_FIXES'
          ]:
              html = re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>\\s*', '', html, flags=re.S)
          # Registration must not contain any registration-side photo field/logic.
          html = re.sub(r'<div[^>]*class="field"[^>]*>\\s*<label[^>]*>[^<]*(?:profile picture|photo|picture)[^<]*</label>.*?</div>', '', html, flags=re.I|re.S)
          p.write_text(html, encoding='utf-8')

          # 2) Make app.js the single browser registration handler, using the deployed
          #    vmc-registration-api Edge Function as the single account-creation service.
          p = Path('app.js')
          js = p.read_text(encoding='utf-8')
          js = js.replace("if(!d.payment_channel)return'Please select a payment channel.';if(!$('#rulesCheck')?.checked)", "if(!d.payment_channel)return'Please select a payment channel.';if(!d.emergency_contact?.trim())return'Emergency contact is required for member safety.';if(!$('#rulesCheck')?.checked)")
          start = js.index('async function registerMember(e){')
          end = js.index('async function loginMember(e){', start)
          replacement = '''async function registerMember(e){e.preventDefault();const f=e.currentTarget,err=$('#registerError'),submit=$('#registerSubmit'),d=Object.fromEntries(new FormData(f).entries()),ve=validateRegistration(d);setError(err,ve);if(ve)return;submit.disabled=true;submit.textContent='Creating account…';try{const tier=d.membership_tier,session=d.session_type,duration=Math.max(1,Math.min(3650,parseInt(d.duration_count,10)||1)),unit=d.duration_unit||({'Per Day':'day','Per Week':'week','Per Month':'month'}[tier]||'month'),payload={full_name:String(d.full_name).trim(),phone_number:String(d.phone_number).trim(),email:String(d.email||'').trim().toLowerCase(),password:d.password,date_of_birth:String(d.date_of_birth||'').trim(),gender:String(d.gender||'').trim(),emergency_contact:String(d.emergency_contact||'').trim(),membership_tier:tier,session_type:session,duration_count:duration,duration_unit:unit,payment_channel:d.payment_channel,receipt_reference:String(d.receipt_reference||'').trim(),rules_accepted:true,rules_version:'VMC Rules v1.0'};const {data,error}=await supabase.functions.invoke('vmc-registration-api',{body:payload});if(error)throw error;if(data?.error)throw Error(data.error);const profile={full_name:d.full_name,membership_tier:tier,session_type:session,payment_channel:d.payment_channel,receipt_reference:d.receipt_reference||'',payment_status:'Payment being reviewed',username:String(data?.username||'')};renderSuccess(profile,d.email||'');f.reset();state.selectedPlan=null;if($('#selectedPlanText'))$('#selectedPlanText').textContent='Choose a plan below or continue with your details.';window.vmcSetRegistrationStep?.(1)}catch(e){console.error('VMC registration error:',e);setError(err,friendlyError(e))}finally{submit.disabled=false;submit.textContent='Complete Registration'}}
'''
          js = js[:start] + replacement + js[end:]
          # Do not show/collect a username in the registration UI; the service generates it.
          js = re.sub(r"captureRegistrationIdentity|beautifulRegistrationWelcome", lambda m:m.group(0), js)
          # Make the second step explicit: DOB/Gender optional, Emergency Contact required.
          js = js.replace('Complete these profile options now, or skip them and finish them on your first gym visit.', 'Date of Birth and Gender are optional. Emergency Contact is required for member safety.')
          js = js.replace("skip.textContent='Skip optional profile details and submit now';", "skip.textContent='Submit with required information';")
          js = js.replace("skip.onclick=()=>{if(validateStep1())f.requestSubmit()};", "skip.onclick=()=>{if(validateStep1()){const emergency=$('#emergencyContact');if(emergency&&!emergency.checkValidity()){emergency.reportValidity();return}f.requestSubmit()}};")
          p.write_text(js, encoding='utf-8')

          # 3) Show the stored username on the member portal, while retaining the
          #    existing portal profile-picture upload/change functionality.
          p = Path('customer-dashboard.html')
          customer = p.read_text(encoding='utf-8')
          marker = '<h2 id="name">Your profile</h2>'
          addition = '<h2 id="name">Your profile</h2><div class="username-display" style="margin:6px 0 12px;color:#aeb2b9;font-size:.78rem">VMC Username: <strong id="username" style="color:#ff6977">—</strong></div>'
          if marker in customer and 'id="username"' not in customer:
              customer = customer.replace(marker, addition, 1)
          needle = "$('#name').textContent=p.full_name||'Your profile';"
          if needle in customer and "$('#username').textContent" not in customer:
              customer = customer.replace(needle, needle+"$('#username').textContent=p.username||'—';", 1)
          p.write_text(customer, encoding='utf-8')

          # 4) Stop the legacy build helper from referencing deleted registration files.
          p = Path('cloudflare-build.mjs')
          build = p.read_text(encoding='utf-8')
          for name, var in [
              ('cloudflare-registration-alignment.js','registrationAlignment'),
              ('vmc-registration-wizard.js','registrationWizard'),
              ('vmc-production-customer-fixes.js','productionFixes')
          ]:
              build = re.sub(r"const "+re.escape(var)+r"=fs\.readFileSync\('"+re.escape(name)+r"','utf8'\);", '', build)
          for expr in [
              r",?registrationAlignmentTag=tag\('VMC_REGISTRATION_ALIGNMENT',registrationAlignment\)",
              r",?registrationWizardTag=tag\('VMC_REGISTRATION_WIZARD',registrationWizard\)",
              r",?productionFixesTag=tag\('VMC_PRODUCTION_CUSTOMER_FIXES',productionFixes\)"
          ]:
              build = re.sub(expr, '', build)
          for expr in [
              r"index=upsert\(index,'VMC_REGISTRATION_ALIGNMENT',registrationAlignmentTag\);dashboard=upsert\(dashboard,'VMC_REGISTRATION_ALIGNMENT',registrationAlignmentTag\);",
              r"index=upsert\(index,'VMC_REGISTRATION_WIZARD',registrationWizardTag\);",
              r"index=upsert\(index,'VMC_PRODUCTION_CUSTOMER_FIXES',productionFixesTag\);dashboard=upsert\(dashboard,'VMC_PRODUCTION_CUSTOMER_FIXES',productionFixesTag\);"
          ]:
              build = re.sub(expr, '', build)
          p.write_text(build, encoding='utf-8')
          PY
      - name: Remove obsolete registration files
        run: |
          rm -f cloudflare-registration-alignment.js vmc-registration-wizard.js vmc-production-customer-fixes.js
      - name: Validate consolidated source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          index=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          customer=Path('customer-dashboard.html').read_text(encoding='utf-8')
          build=Path('cloudflare-build.mjs').read_text(encoding='utf-8')
          assert 'name="username"' not in index
          assert 'VMC_REGISTRATION_ALIGNMENT' not in index
          assert 'VMC_REGISTRATION_WIZARD' not in index
          assert 'VMC_PRODUCTION_CUSTOMER_FIXES' not in index
          assert "invoke('vmc-registration-api'" in app
          assert 'supabase.auth.signUp' not in app[app.index('async function registerMember(e){'):app.index('async function loginMember(e){')]
          assert 'd.emergency_contact' in app
          assert 'id="username"' in customer
          assert "p.username||'—'" in customer
          assert 'cloudflare-registration-alignment.js' not in build
          assert 'vmc-registration-wizard.js' not in build
          assert 'vmc-production-customer-fixes.js' not in build
          for f in ['cloudflare-registration-alignment.js','vmc-registration-wizard.js','vmc-production-customer-fixes.js']:
              assert not Path(f).exists(), f
          print('VMC registration consolidation validation passed.')
          PY
      - name: Commit consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidate VMC registration into one service'
          git push
      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/vmc-registration-consolidation.yml
          git commit -m 'Remove one-time registration consolidation workflow'
          git push
