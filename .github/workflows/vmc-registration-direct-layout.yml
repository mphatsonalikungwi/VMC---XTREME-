name: VMC registration direct layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct registration layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* VMC DIRECT REGISTRATION LAYOUT 2026-09-02 */'
          if marker not in s:
            css='''<style id="VMC_DIRECT_REGISTRATION_LAYOUT">\n/* VMC DIRECT REGISTRATION LAYOUT 2026-09-02 */\n#registerView .vmc-reg-step#vmcRegStep1:not([hidden]),#registerView .vmc-reg-step#vmcRegStep2:not([hidden]){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:14px 18px!important;align-items:start!important;width:100%!important}\n#registerView .vmc-reg-step#vmcRegStep1>*:not(.field),#registerView .vmc-reg-step#vmcRegStep2>*:not(.field){grid-column:1 / -1!important;width:100%!important}\n#registerView .vmc-reg-step#vmcRegStep1>.field,#registerView .vmc-reg-step#vmcRegStep2>.field{grid-column:auto!important;min-width:0!important;width:100%!important;margin:0!important}\n#registerView .vmc-reg-step#vmcRegStep1 .field input,#registerView .vmc-reg-step#vmcRegStep1 .field select,#registerView .vmc-reg-step#vmcRegStep2 .field input,#registerView .vmc-reg-step#vmcRegStep2 .field select{width:100%!important;box-sizing:border-box!important}\n#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:12px 16px!important;width:100%!important}\n#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>h4,#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>.vmc-reg-section-copy{grid-column:1 / -1!important}\n#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>.field,#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>.vmc-reg-price{grid-column:auto!important}\n#registerView .vmc-reg-step#vmcRegStep1 label:not(.check)::after{content:' *'!important;color:#ef233c!important;font-weight:900!important}\n#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-rules{grid-column:1 / -1!important}\n@media(max-width:760px){#registerView .vmc-reg-step#vmcRegStep1:not([hidden]),#registerView .vmc-reg-step#vmcRegStep2:not([hidden]){grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}}\n</style>'''
            s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('src="app.js"','src="app.js?v=20260902-layout"',1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'VMC_DIRECT_REGISTRATION_LAYOUT' index.html
          grep -q 'app.js?v=20260902-layout' index.html
          grep -q 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: force registration two-column layout in published page'
          git push
