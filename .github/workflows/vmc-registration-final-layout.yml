name: Final registration layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final registration CSS
        run: |
          python3 -c "from pathlib import Path; p=Path('app.js'); s=p.read_text(); marker='/* VMC FINAL REGISTRATION LAYOUT */'; assert marker not in s, 'final layout already present'; block='''\n/* VMC FINAL REGISTRATION LAYOUT */\n(()=>{const apply=()=>{if(document.getElementById('vmcFinalRegistrationLayout'))return;const st=document.createElement('style');st.id='vmcFinalRegistrationLayout';st.textContent=\"#registerView .vmc-reg-step#vmcRegStep1:not([hidden]),#registerView .vmc-reg-step#vmcRegStep2:not([hidden]){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:14px 18px!important;align-items:start!important}#registerView .vmc-reg-step#vmcRegStep1>*:not(.field),#registerView .vmc-reg-step#vmcRegStep2>*:not(.field){grid-column:1/-1!important}#registerView .vmc-reg-step#vmcRegStep1 .field,#registerView .vmc-reg-step#vmcRegStep2 .field{min-width:0!important;margin:0!important}#registerView .vmc-reg-step#vmcRegStep1 .field input,#registerView .vmc-reg-step#vmcRegStep1 .field select,#registerView .vmc-reg-step#vmcRegStep2 .field input,#registerView .vmc-reg-step#vmcRegStep2 .field select{width:100%!important;box-sizing:border-box!important}#registerView .vmc-reg-step#vmcRegStep1 .field label::after{content:' *';color:#ef233c;font-weight:900}#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-rules::after{content:' *';color:#ef233c;font-weight:900;margin-left:2px}#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:12px 16px!important}#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>h4,#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>.vmc-reg-section-copy{grid-column:1/-1!important}\";document.head.appendChild(st)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply()})();\n'''; p.write_text(s+block)"
      - name: Verify final layout
        run: |
          grep -q 'VMC FINAL REGISTRATION LAYOUT' app.js
          grep -q 'vmcRegStep1:not(\[hidden\])' app.js
          grep -q "vmcRegStep1 .field label::after" app.js
          grep -q 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' app.js
      - name: Commit final layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix: enforce two-column registration layout on all devices'
          git push
