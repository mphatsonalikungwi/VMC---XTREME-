name: VMC Registration Finalize
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable canonical two-step registration initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          js=p.read_text(encoding='utf-8')
          old="document.addEventListener('DOMContentLoaded',()=>{setupNavigation();setupLoginAndRegistrationSwitches();setupContact();setupWaterAndPayments();setupGallery();setupMap();setupServices();injectPasswordToggles();"
          new="document.addEventListener('DOMContentLoaded',()=>{setupNavigation();setupLoginAndRegistrationSwitches();setupContact();setupWaterAndPayments();setupGallery();setupMap();setupServices();setupRegistrationWizard();injectPasswordToggles();"
          if old not in js:
              raise SystemExit('Registration initialization marker not found')
          js=js.replace(old,new,1)
          p.write_text(js,encoding='utf-8')

          p=Path('cloudflare-build.mjs')
          build=p.read_text(encoding='utf-8')
          build=build.replace("app=app.replace('setupRegistrationWizard();','');",'')
          p.write_text(build,encoding='utf-8')
          PY
      - name: Validate and remove this one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8'); build=Path('cloudflare-build.mjs').read_text(encoding='utf-8')
          assert 'setupServices();setupRegistrationWizard();injectPasswordToggles();' in app
          assert "app=app.replace('setupRegistrationWizard();','');" not in build
          print('Canonical registration wizard initialization verified.')
          PY
          rm -f .github/workflows/vmc-registration-finalize.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Initialize canonical two-step registration wizard'
          git push
