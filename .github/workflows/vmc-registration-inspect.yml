name: Inspect registration layout
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect layout overrides
        run: |
          python3 -c "from pathlib import Path; s=Path('app.js').read_text(); a=s.find('function vmcRegistrationSameLayout'); print('sameLayout=',a); print(s[a:a+9000])"
