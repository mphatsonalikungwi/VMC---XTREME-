name: VMC registration layout final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact registration layout
        env:
          INSERT_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          marker='function setupRegistrationWizard()'
          assert marker in s, 'registration wizard function not found'
          insert=base64.b64decode(os.environ['INSERT_B64']).decode()
          if 'vmcRegistrationCompactStyles' not in s:
              s=s.replace(marker,insert+marker,1)
              p.write_text(s)
          PY
      - name: Verify source
        run: |
          grep -q 'vmcCompactRegistrationLayout' app.js
          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' app.js
          grep -q "#registerView #vmcRegStep1 label::after" app.js
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          rm .github/workflows/vmc-registration-layout-final.yml
          git add -u .github/workflows/vmc-registration-layout-final.yml
          git commit -m 'fix: compact two-page registration layout'
          git push
