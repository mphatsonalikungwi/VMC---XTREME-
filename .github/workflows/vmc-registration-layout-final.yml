name: VMC registration layout final
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply registration layout
        env:
          INSERT_B64: 
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          marker='function setupRegistrationWizard()'
          assert marker in s, 'registration wizard function not found'
          insert=base64.b64decode(__import__('os').environ['INSERT_B64']).decode()
          assert 'vmcRegistrationCompactStyles' not in s, 'layout patch already present'
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'vmcImproveRegistrationLayout' app.js
          grep -q 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' app.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix: compact two-page registration layout'
          git push
          rm .github/workflows/vmc-registration-layout-final.yml
          git add .github/workflows/vmc-registration-layout-final.yml
          git commit -m 'chore: remove temporary registration layout workflow'
          git push
