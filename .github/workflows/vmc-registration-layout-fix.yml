name: Fix registration layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace layout override safely
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('app.js'); s=p.read_text(); css=\"#registerView .vmc-reg-step#vmcRegStep1:not([hidden]),#registerView .vmc-reg-step#vmcRegStep2:not([hidden]){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:14px 18px!important;align-items:start!important}#registerView .vmc-reg-step#vmcRegStep1>*:not(.field),#registerView .vmc-reg-step#vmcRegStep2>*:not(.field){grid-column:1/-1}#registerView .vmc-reg-step#vmcRegStep1 .field,#registerView .vmc-reg-step#vmcRegStep2 .field{min-width:0!important;margin:0!important}#registerView .vmc-reg-step#vmcRegStep1 .field input,#registerView .vmc-reg-step#vmcRegStep1 .field select,#registerView .vmc-reg-step#vmcRegStep2 .field input,#registerView .vmc-reg-step#vmcRegStep2 .field select{width:100%!important;box-sizing:border-box}#registerView .vmc-reg-step#vmcRegStep1 .field label::after{content:' *';color:#ef233c;font-weight:900}#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-rules::after{content:' *';color:#ef233c;font-weight:900;margin-left:2px}#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership{display:grid!important;grid-template-columns:1fr 1fr!important;gap:12px 16px!important}#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>h4,#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership>.vmc-reg-section-copy{grid-column:1/-1}#registerView .vmc-reg-step#vmcRegStep1 .vmc-reg-membership .vmc-reg-price{margin:0!important}\"; new='function vmcRegistrationSameLayout(){if(document.getElementById(\"vmcRegistrationSameLayout\"))return;const st=document.createElement(\"style\");st.id=\"vmcRegistrationSameLayout\";st.textContent=`'+css+'`;document.head.appendChild(st)}'; pattern=r'function vmcRegistrationSameLayout\(\)\{.*?\n\}'; s2,n=re.subn(pattern,new,s,count=1,flags=re.S); assert n==1, 'layout function not found'; p.write_text(s2)"
      - name: Verify
        run: |
          grep -q 'vmcRegStep1:not(\[hidden\])' app.js
          grep -q 'vmcRegStep1 .field label::after' app.js
          grep -q 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' app.js
      - name: Commit and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix: enforce consistent two-column registration form' || true
          git push
          rm .github/workflows/vmc-registration-layout-fix.yml .github/workflows/vmc-registration-inspect.yml
          git add .github/workflows/vmc-registration-layout-fix.yml .github/workflows/vmc-registration-inspect.yml
          git commit -m 'chore: remove temporary registration workflows' || true
          git push
