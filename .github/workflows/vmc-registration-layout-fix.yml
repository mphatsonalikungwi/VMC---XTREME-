name: VMC Registration Layout Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply registration layout patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='VMC_REGISTRATION_LAYOUT_FIX_V2'
          if marker in s:
              raise SystemExit('Patch already present')
          needle="form.appendChild(box);markRequired(form);"
          patch="""form.appendChild(box);\nconst membership=view.querySelector('.selected-plan');\nif(membership){\n  const label=membership.querySelector('small');\n  const text=membership.querySelector('strong');\n  if(label)label.textContent='Choose your membership';\n  if(text&&!text.textContent.trim())text.textContent='Select the membership that suits you best.';\n  membership.classList.add('vmc-membership-choice');\n  const progress=$('.vmc-progress',box);\n  if(progress)box.insertBefore(membership,progress);\n}\nconst welcome=$('.vmc-welcome',box);\nif(welcome){\n  const small=welcome.querySelector('small');\n  if(small)small.textContent=\"Welcome to VMC Xtreme Fitness. We’re glad you’re here. Tell us a few details and we’ll get your membership ready.\";\n}\nmarkRequired(form);"""
          if needle not in s:
              raise SystemExit('Registration wizard insertion point not found')
          s=s.replace(needle,patch,1)
          css="""<style id=\"VMC_REGISTRATION_LAYOUT_FIX_V2\">\n.vmc-wizard{margin:0!important}\n.vmc-welcome{margin-bottom:12px!important}\n.vmc-membership-choice{margin:0 0 12px!important}\n.vmc-progress{margin-bottom:12px!important}\n.vmc-page-head{margin-top:0!important}\n.vmc-page-head>b{font-size:1.05rem}\n@media(max-width:600px){.vmc-welcome strong{font-size:1.3rem}.vmc-welcome small{font-size:.75rem}.vmc-membership-choice{padding:12px!important}}\n</style>"""
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/vmc-registration-layout-fix.yml
          git commit -m "Improve customer registration form hierarchy" || exit 0
          git rm .github/workflows/vmc-registration-layout-fix.yml
          git commit -m "Remove one-time registration layout workflow"
          git push
