name: VMC Registration Authorized Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous registration design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')

          # app.js contains the original registration wizard. These later layers were
          # overriding that design and/or injecting a second registration implementation.
          script_ids = [
              'VMC_CLOUDFLARE_UI_PATCH',
              'VMC_UI_FIXES_V2',
              'VMC_REGISTRATION_ALIGNMENT',
              'VMC_FINAL_HARDENING',
              'VMC_CUSTOMER_EXPERIENCE',
              'VMC_AUTH_IDENTIFIER',
              'VMC_PRODUCTION_CUSTOMER_FIXES',
              'VMC_REGISTRATION_LAYOUT_UPGRADE_SCRIPT',
              'VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT',
          ]
          for sid in script_ids:
              html = re.sub(r'<script id="' + re.escape(sid) + r'">.*?</script>\\s*', '', html, flags=re.S)

          style_ids = ['VMC_REGISTRATION_LAYOUT_UPGRADE', 'VMC_REGISTRATION_FINAL_LAYOUT_FIX']
          for sid in style_ids:
              html = re.sub(r'<style id="' + re.escape(sid) + r'">.*?</style>\\s*', '', html, flags=re.S)

          # No registration-side profile-picture upload.
          html = re.sub(r'async function uploadAvatar\\(sb,file,userId\\)\\{.*?\\}\\n', '', html, count=1, flags=re.S)
          Path('index.html').write_text(html, encoding='utf-8')

          js = Path('app.js').read_text(encoding='utf-8')

          # Payment reference is optional; emergency contact is required.
          js = js.replace(
              "if(!d.payment_channel)return'Please select a payment channel.';if(!$('#rulesCheck')?.checked)",
              "if(!d.payment_channel)return'Please select a payment channel.';if(!d.emergency_contact?.trim())return'Emergency contact is required for member safety.';if(!$('#rulesCheck')?.checked)"
          )
          js = js.replace(
              "['fullName','phoneNumber','registerEmail','registerPassword','tier','session','paymentChannel','receiptReference']",
              "['fullName','phoneNumber','registerEmail','registerPassword','tier','session','paymentChannel']"
          )

          # Use vmc-registration-api as the single registration path. It generates the username.
          start = js.index('async function registerMember(e){')
          end = js.index('\nasync function loginMember', start)
          new_register = '''async function registerMember(e){e.preventDefault();const f=e.currentTarget,err=$('#registerError'),submit=$('#registerSubmit'),d=Object.fromEntries(new FormData(f).entries()),ve=validateRegistration(d);setError(err,ve);if(ve)return;submit.disabled=true;submit.textContent='Creating account…';try{const tier=d.membership_tier,session=d.session_type,duration=Math.max(1,Math.min(3650,parseInt(d.duration_count,10)||1)),unit=d.duration_unit||({'Per Day':'day','Per Week':'week','Per Month':'month'}[tier]||'month'),amount=priceFor(tier,session)*duration;if(!amount)throw Error('The selected membership price could not be determined.');const payload={full_name:String(d.full_name).trim(),phone_number:String(d.phone_number).trim(),email:String(d.email||'').trim().toLowerCase(),password:d.password,date_of_birth:String(d.date_of_birth||'').trim(),gender:String(d.gender||'').trim(),emergency_contact:String(d.emergency_contact||'').trim(),membership_tier:tier,session_type:session,duration_count:duration,duration_unit:unit,payment_channel:d.payment_channel,receipt_reference:String(d.receipt_reference||'').trim(),rules_accepted:true,rules_version:'VMC Rules v1.0'};const {data,error}=await supabase.functions.invoke('vmc-registration-api',{body:payload});if(error)throw error;if(data?.error)throw Error(data.error);const username=String(data?.username||'');const profile={full_name:d.full_name,membership_tier:tier,session_type:session,payment_channel:d.payment_channel,receipt_reference:d.receipt_reference||'',payment_status:'Pending Payment Verification',username};renderSuccess(profile,d.email||'');f.reset();state.selectedPlan=null;if($('#selectedPlanText'))$('#selectedPlanText').textContent='Choose a plan below or continue with your details.';window.vmcSetRegistrationStep?.(1)}catch(e){console.error('VMC registration error:',e);setError(err,friendlyError(e))}finally{submit.disabled=false;submit.textContent='Complete Registration'}}'''
          js = js[:start] + new_register + js[end:]

          # Make the generated username visible in the success summary, without adding a form field.
          old = '<div class="account-grid"><div><small>Member</small>'
          new = '<div class="account-grid"><div><small>VMC Username</small><strong>${esc(profile?.username||\'Generated automatically\')}</strong></div><div><small>Member</small>'
          js = js.replace(old, new, 1)
          Path('app.js').write_text(js, encoding='utf-8')
          PY

      - name: Verify registration repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('app.js').read_text(encoding='utf-8')
          forbidden = [
              'VMC_CLOUDFLARE_UI_PATCH', 'VMC_UI_FIXES_V2', 'VMC_REGISTRATION_ALIGNMENT',
              'VMC_FINAL_HARDENING', 'VMC_PRODUCTION_CUSTOMER_FIXES',
              'VMC_REGISTRATION_LAYOUT_UPGRADE_SCRIPT', 'VMC_REGISTRATION_FINAL_LAYOUT_FIX_SCRIPT'
          ]
          for item in forbidden:
              assert item not in html, item
          assert "if(!d.emergency_contact?.trim())" in js
          assert "if(!d.receipt_reference?.trim())" not in js
          assert "vmc-registration-api" in js
          assert 'profilePicture' not in html
          print('VMC registration repair verification passed.')
          PY

      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore previous registration design and runtime'
          git push
