name: VMC Registration Authorized Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous registration form design and keep authorized field rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove the later registration layers that override the previous form design,
          # re-add username, or introduce registration-side photo logic.
          s=re.sub(r'<script id="VMC_FINAL_HARDENING">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<style id="VMC_REGISTRATION_LAYOUT_UPGRADE">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<script id="VMC_REGISTRATION_LAYOUT_UPGRADE_SCRIPT">.*?</script>', '', s, flags=re.S)

          # Preserve the previous two-step form design while applying only the authorized field rules.
          s=s.replace("['fullName','registerUsername','phoneNumber','registerPassword','tier','session','durationCount','durationUnit','paymentChannel']", "['fullName','phoneNumber','registerPassword','tier','session','durationCount','durationUnit','paymentChannel']")
          s=s.replace("if(!usernameOk($('#registerUsername').value))return errorBox('Choose a valid VMC Username using lowercase letters, numbers, dot, underscore or hyphen.');", "")
          s=s.replace("const file=$('#profilePicture')?.files?.[0]||null;", "")
          s=s.replace("if(!d.full_name||!usernameOk(d.username)||!phoneOk(d.phone_number)||!d.password||!d.membership_tier||!d.session_type||count<1||!d.payment_channel||!$('#rulesCheck').checked)", "if(!d.full_name||!phoneOk(d.phone_number)||!d.password||!d.membership_tier||!d.session_type||count<1||!d.payment_channel||!d.emergency_contact?.trim()||!$('#rulesCheck').checked)")
          s=re.sub(r"\$\('#profilePicture'\)\.onchange=.*?readAsDataURL\(file\)\}\);", "", s, count=1, flags=re.S)

          # Payment reference is explicitly optional.
          needle='<div class="field"><label for="paymentChannel">Payment Method</label><select id="paymentChannel" name="payment_channel" required>'
          if 'id="paymentReference"' not in s and needle in s:
              end='</select></div>'
              pos=s.find(end, s.find(needle)) + len(end)
              field='<div class="field"><label for="paymentReference">Payment Reference <span class="vmc-email-optional">(Optional)</span></label><input id="paymentReference" name="receipt_reference" autocomplete="off" placeholder="Optional"></div>'
              s=s[:pos]+field+s[pos:]

          # Remove any remaining registration-side avatar helper from the final registration layer.
          s=re.sub(r"async function uploadAvatar\(sb,file,userId\)\{.*?\}\n", "", s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(!d.receipt_reference?.trim())return'Please enter the payment receipt/reference number.';", "")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore previous registration form design'
          git push
