<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>Settings | VMC Xtreme Fitness</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#08090b;--card:#111318;--line:#292d35;--red:#e31b2d;--muted:#9ca3ad;--good:#8ee9aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#40121b,transparent 34%),var(--bg);color:#fff;font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:10;background:#08090cf5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.bar{height:66px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:950;letter-spacing:.08em}.brand small{display:block;color:#777;font-size:9px;letter-spacing:.18em}.actions{display:flex;gap:7px}.btn{border:1px solid #393d45;border-radius:999px;padding:10px 14px;background:#17191e;color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.red{background:var(--red);border-color:var(--red)}main{padding:18px 0 40px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}.hero{margin-bottom:14px;border-color:#54232c;background:linear-gradient(135deg,#281117,#101217 70%)}.eyebrow{color:#ff6977;font-size:10px;font-weight:950;letter-spacing:.18em;text-transform:uppercase}.hero h1{margin:7px 0;font-size:clamp(2.2rem,7vw,4rem);line-height:1}.hero p{margin:0;color:#aeb4bd}.card{margin-bottom:14px}.card h2{margin:0 0 6px;font-size:1.05rem}.muted{color:#858c97;font-size:12px}.field{margin-top:12px}.field label{display:block;color:#8f96a0;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #363a42;border-radius:11px;background:#17191e;color:#fff;outline:none}.field input:focus{border-color:#8ee9aa;box-shadow:0 0 0 3px rgba(142,233,170,.07)}.submit{margin-top:13px;width:100%}.msg{min-height:20px;margin-top:9px;font-size:12px}.ok{color:var(--good)}.err{color:#ff9ca6}.security-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.security-row:first-of-type{border-top:0}.security-row strong{font-size:13px}.security-row span{display:block;color:#858c97;font-size:11px;margin-top:2px}@media(max-width:760px){.wrap{width:calc(100% - 14px)}.bar{height:60px}.actions .home{display:none}.hero,.card{padding:18px}}
</style></head><body><header class="top"><div class="wrap bar"><div class="brand">VMC XTREME<small>MY VMC</small></div><div class="actions"><a class="btn home" href="customer-dashboard.html">My VMC</a><button class="btn red" id="logout">Log Out</button></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">VMC SETTINGS</div><h1>Account & Security</h1><p>Manage the security of your VMC member account.</p></section><section class="card" id="security"><h2>Account & Security</h2><div class="security-row"><div><strong>Signed-in account</strong><span id="accountEmail">Checking account…</span></div><span class="ok">Protected</span></div><div class="security-row" id="password"><div><strong>Change Password</strong><span>Set a new password for your VMC account.</span></div></div><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Enter it again"></div><button class="btn red submit" id="changePassword">Change Password</button><div class="msg" id="msg"></div></section></main><script>const sb=supabase.createClient('https://czdxwlioouuredaliplw.supabase.co','sb_publishable_-ldpCiaxCElX9c7Q6zLqqQ_gHUBunBI',{auth:{persistSession:true,autoRefreshToken:true}});const $=s=>document.querySelector(s);async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.href='index.html';$('#accountEmail').textContent=user.email&&user.email.endsWith('@accounts.vmc.local')?'Email address not provided':user.email||'Email address not provided';}$('#changePassword').onclick=async()=>{const a=$('#newPassword').value,b=$('#confirmPassword').value,msg=$('#msg');msg.className='msg';msg.textContent='';if(a.length<8){msg.classList.add('err');msg.textContent='Password must be at least 8 characters.';return}if(a!==b){msg.classList.add('err');msg.textContent='The passwords do not match.';return}const button=$('#changePassword');button.disabled=true;button.textContent='Updating…';try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;$('#newPassword').value='';$('#confirmPassword').value='';msg.classList.add('ok');msg.textContent='Your password has been updated successfully.'}catch(e){msg.classList.add('err');msg.textContent=e?.message||'Could not update your password.'}finally{button.disabled=false;button.textContent='Change Password'}};$('#logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};boot();</script></body></html>
